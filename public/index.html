<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>knowkin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#050A1C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050A1C;--bg2:#0A1330;--surface:#0D1736;--surface2:#122046;--ink:#E7EDFF;--muted:#94A3CC;--line:#22305C;
  --cyan:#5CD2FF;--violet:#9B7CFF;--pink:#FF6FC8;--accent:#5CD2FF;--accent-ink:#04101F;--red:#FF7A9A;
  --l-event:#5CD2FF;--l-know:#6F9BFF;--l-think:#B07CFF;--l-act:#FF6FC8;--l-rel:#4FE3C1;
  color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050A1C}}
:root[data-theme="dark"]{--bg:#050A1C}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Zen Kaku Gothic New",-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:16px;line-height:1.7;
  background:radial-gradient(1200px 700px at 50% 0%,#12235A 0%,var(--bg) 60%) fixed,var(--bg)}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;padding:22px 16px 72px}
.brand{display:flex;align-items:center;gap:12px;color:var(--cyan)}
.brand img{width:40px;height:40px;flex:none}
.mark{font-family:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;font-weight:400;font-size:34px;line-height:1;margin:0;color:var(--ink);letter-spacing:.01em}
.tagline{color:var(--muted);margin:6px 0 16px;font-size:14px}

.space{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(60% 55% at 50% 50%,#1B2E72 0%,#0B1437 55%,#050A1C 100%)}
.space-head{position:absolute;left:18px;right:18px;top:14px;display:flex;justify-content:space-between;align-items:baseline;z-index:3;pointer-events:none}
.space-title{margin:0;font-size:15px;font-weight:500;color:var(--muted);letter-spacing:.08em}
.space-date{font-size:14px;color:var(--muted)}
.map{position:relative;aspect-ratio:16/10;min-height:380px}
@media (max-width:620px){.map{aspect-ratio:3/4.2}}
.map canvas{position:absolute;inset:0;width:100%;height:100%}
.map svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.map svg.links path{fill:none;stroke:url(#linkGrad);stroke-width:2;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(155,124,255,.9))}
.map svg.links path.flow{stroke:#fff;stroke-width:1.4;stroke-dasharray:2 22;opacity:.8;filter:none}
@media (prefers-reduced-motion:no-preference){.map svg.links path.flow{animation:flow 2.4s linear infinite}}
@keyframes flow{to{stroke-dashoffset:-48}}

.node{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);z-index:2;background:none;border:0;padding:0;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .2s}
@media (max-width:620px){.node{left:var(--mx);top:var(--my)}}
.orb{width:clamp(46px,7vw,64px);height:clamp(46px,7vw,64px);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0%,var(--c) 28%,color-mix(in srgb,var(--c) 35%,transparent) 62%,transparent 72%);
  box-shadow:0 0 18px 4px color-mix(in srgb,var(--c) 55%,transparent),0 0 44px 10px color-mix(in srgb,var(--c) 22%,transparent)}
.node .name{font-weight:700;font-size:clamp(15px,2.2vw,19px);letter-spacing:.06em;text-shadow:0 0 10px color-mix(in srgb,var(--c) 80%,transparent)}
.node .count{font-size:12px;color:var(--muted);min-height:1.2em;margin-top:-4px}
.node:hover{transform:translate(-50%,-50%) scale(1.07)}
.node[aria-pressed="true"] .orb{box-shadow:0 0 0 2px #fff,0 0 24px 8px color-mix(in srgb,var(--c) 70%,transparent),0 0 60px 16px color-mix(in srgb,var(--c) 30%,transparent)}
.node.core{gap:2px}
.node.core .brain{width:clamp(110px,17vw,168px);height:auto;color:#BDEBFF;
  filter:drop-shadow(0 0 6px #5CD2FF) drop-shadow(0 0 22px rgba(92,210,255,.75)) drop-shadow(0 0 48px rgba(176,124,255,.55))}
@media (prefers-reduced-motion:no-preference){.node.core .brain{animation:pulse 3.2s ease-in-out infinite}}
@keyframes pulse{0%,100%{opacity:.88}50%{opacity:1}}
.node.core .name,.node.core .count{background:rgba(6,12,34,.72);border-radius:10px;padding:0 10px}
.node.core .name{font-size:clamp(20px,3vw,26px);text-shadow:0 0 14px rgba(92,210,255,.9)}
.node.core .count{color:var(--cyan)}
.node.core[aria-pressed="true"] .brain{color:#fff}

.magnets{display:flex;gap:10px;justify-content:flex-end;margin:12px 2px 0;flex-wrap:wrap}
.magnet{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 16px;font-size:14px;display:flex;gap:8px;align-items:center}
.magnet::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.magnet[aria-pressed="true"]{border-color:var(--cyan)}
.magnet .n{color:var(--pink);font-weight:700}

.panel{margin-top:30px}
.panel h2{font-weight:700;font-size:24px;margin:0 0 4px;color:var(--ink);letter-spacing:.04em}
.panel .lead{color:var(--muted);margin:0 0 16px;font-size:15px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.rec-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.recbtn{display:flex;align-items:center;gap:10px;border:0;border-radius:999px;background:linear-gradient(90deg,#FF5FA8,#B07CFF);color:#fff;padding:12px 22px;font-weight:700;box-shadow:0 0 18px rgba(255,95,168,.45)}
.recbtn .dot{width:12px;height:12px;border-radius:50%;background:#fff}
.recbtn.on .dot{border-radius:2px}
.timer{font-variant-numeric:tabular-nums;color:var(--muted)}
.drop{margin-top:14px;border:1.5px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--cyan);color:var(--ink)}
.drop strong{color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--cyan);text-decoration:underline;font-weight:700}
.primary{background:var(--cyan);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 20px;font-weight:700;box-shadow:0 0 14px rgba(92,210,255,.4)}
.primary:disabled,.recbtn:disabled{opacity:.45;cursor:default;box-shadow:none}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.ghost.on{border-color:var(--pink);color:var(--pink)}
.status{font-size:14px;color:var(--muted);margin:12px 2px 0;min-height:1.7em}
.status.err{color:var(--red)}
.prog{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg2)}
.prog-file{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin:0 0 8px}
.prog-file span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog-bar{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden}
.prog-bar span{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));transition:width .3s ease}
.prog-row{display:flex;justify-content:space-between;gap:10px;margin:8px 0 0;font-size:14px}
.prog-row span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog-steps{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px;color:var(--muted)}
.prog-steps li{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.prog-steps li::before{content:"";width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line)}
.prog-steps li.now{color:var(--ink)}
.prog-steps li.now::before{border-color:var(--cyan);background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
@media (prefers-reduced-motion:no-preference){.prog-steps li.now::before{animation:pulse 1.2s ease-in-out infinite}}
.prog-steps li.done{color:var(--ink)}
.prog-steps li.done::before{border-color:var(--l-rel);background:var(--l-rel)}
.result{margin-top:16px;border-left:3px solid var(--cyan);padding:4px 0 4px 14px;border-radius:0}
.result h3,.rec-item h3{font-weight:700;font-size:18px;margin:0}
.result ul,.rec-item ul{margin:6px 0 0;padding-left:1.2em}
details{margin-top:8px;color:var(--muted);font-size:14px}
details p{white-space:pre-wrap;color:var(--ink);margin:6px 0 0}
.rec-item{padding:14px 0;border-bottom:1px solid var(--line)}
.meta{margin:4px 0 0;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 12px}
.vtext{display:block;width:100%;min-height:150px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);resize:vertical;line-height:1.7}
.composer textarea{display:block;width:100%;min-height:130px;border:0;background:transparent;resize:vertical;outline:none;line-height:1.7}
.composer textarea::placeholder{color:var(--muted)}
.prompts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 12px;font-size:13px;color:var(--muted)}
.chip:hover{color:var(--ink);border-color:var(--cyan)}
.actions{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.search{width:100%;margin:0 0 10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.list{list-style:none;margin:0;padding:0}
.item{padding:14px 0;border-bottom:1px solid var(--line);display:flex;gap:12px}
.item .body{flex:1;min-width:0}
.type{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.type::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}
.content{margin:2px 0 0;overflow-wrap:anywhere}
.quote{margin:4px 0 0;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.done .content{text-decoration:line-through;color:var(--muted)}
.check{width:20px;height:20px;margin-top:4px;accent-color:var(--cyan)}
.row-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.row-actions select,.row-actions button{font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2)}
.row-actions .del.armed{color:var(--red);border-color:var(--red)}
.empty{color:var(--muted);padding:20px 0}
h4{font-size:15px;margin:22px 0 6px;color:var(--muted);font-weight:500}
.core-summary{font-size:21px;line-height:1.6;margin:0;font-weight:500}
.core ul{margin:4px 0 0;padding-left:1.2em}
.copybox{width:100%;min-height:160px;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);padding:10px;font-size:13px}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;color:var(--muted);margin-top:20px}
.sr{position:absolute;left:-9999px}
.auth{max-width:440px;margin:24px auto 0}
.auth-tabs{display:flex;gap:4px;margin:0 0 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.auth-tabs button{flex:1;border:0;background:none;border-radius:9px;padding:8px;color:var(--muted);font-weight:700}
.auth-tabs button[aria-selected="true"]{background:var(--surface2);color:var(--ink)}
.field{display:block;margin:0 0 14px}
.field span{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
.field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2)}
.hint{font-size:13px;color:var(--muted);margin:-8px 0 12px}
.primary.wide{width:100%;padding:12px}
.copyrow{display:flex;gap:8px;align-items:center;margin:4px 0 14px}
.copyrow input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);font-size:13px}
@media (prefers-reduced-motion:reduce){.node{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="/favicon.svg" alt="" width="40" height="40">
    <h1 class="mark">knowkin</h1>
  </div>
  <p class="tagline">脳筋でも大丈夫。覚えるのは、こっちでやる。</p>

  <section id="login" class="auth" hidden>
    <div class="auth-tabs" role="tablist">
      <button type="button" role="tab" data-auth="login" aria-selected="true">ログイン</button>
      <button type="button" role="tab" data-auth="signup" aria-selected="false">アカウントを作る</button>
    </div>
    <div class="sheet">
      <label class="field" id="f-name" hidden><span>名前</span><input id="a-name" type="text" autocomplete="name"></label>
      <label class="field"><span>メールアドレス</span><input id="a-email" type="email" autocomplete="email" inputmode="email"></label>
      <label class="field"><span>パスワード</span><input id="a-pass" type="password" autocomplete="current-password"></label>
      <p class="hint" id="a-passhint" hidden>8文字以上</p>
      <label class="field" id="f-code" hidden><span>招待コード</span><input id="a-code" type="text" autocomplete="off"></label>
      <div class="actions" style="justify-content:stretch"><button class="primary wide" type="button" id="authBtn">ログイン</button></div>
      <p class="status err" id="authErr"></p>
      <p class="hint" id="authNote"></p>
    </div>
  </section>

  <main id="app" hidden>
    <div class="space">
      <div class="space-head"><h2 class="space-title">脳のネットワーク</h2><span class="space-date" id="today"></span></div>
      <div class="map" id="map" role="group" aria-label="記憶と5つの層のネットワーク。脳を押すと残せます。層を押すとその記憶を見られます"></div>
    </div>
    <div class="magnets" id="magnets"></div>
    <section class="panel" id="panel" aria-live="polite"></section>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
</div>

<script>
const TYPES={event:{label:'記憶',layer:'event'},input:{label:'インプット',layer:'know'},lesson:{label:'フィードバック・教訓',layer:'know'},idea:{label:'アイディア',layer:'think'},decision:{label:'判断と理由',layer:'think'},value:{label:'価値観',layer:'think'},question:{label:'未解決の問い',layer:'think'},task:{label:'タスク',layer:'act'},goal:{label:'目標',layer:'act'},person:{label:'人物',layer:'rel'}};
const LAYERS=[{id:'event',label:'出来事'},{id:'know',label:'知識'},{id:'think',label:'思考'},{id:'act',label:'行動'},{id:'rel',label:'関係'}];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={units:[],failed:[],core:null,recordings:[]};
const ui={view:'rec',layer:null,q:'',armed:null,result:null};
let busy=false;

function setStatus(t,err=false){const s=$('status');s.textContent=t;s.classList.toggle('err',err);}
async function api(path,opts={}){
  const headers={...(opts.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opts.headers||{})};
  const r=await fetch(path,{...opts,headers,credentials:'same-origin'});
  if(r.status===401&&!path.startsWith('/api/auth/')){showLogin('ログインが切れました。もう一度ログインしてください。');throw new Error('unauthorized');}
  const body=(r.headers.get('content-type')||'').includes('json')?await r.json():await r.text();
  if(!r.ok)throw new Error((body&&body.error)||'通信に失敗しました');
  return body;
}
let authMode='login',signup={open:true,needCode:false};
function setAuthMode(m){
  authMode=m;const s=m==='signup';
  document.querySelectorAll('[data-auth]').forEach(b=>b.setAttribute('aria-selected',b.dataset.auth===m));
  $('f-name').hidden=!s;$('a-passhint').hidden=!s;$('f-code').hidden=!(s&&signup.needCode);
  $('a-pass').autocomplete=s?'new-password':'current-password';
  $('authBtn').textContent=s?'アカウントを作ってはじめる':'ログイン';$('authBtn').disabled=s&&!signup.open;
  $('authNote').textContent=s?(signup.open?(signup.needCode?'アカウントを作るには招待コードが必要です。':'最初のアカウントです。これまでに残した記憶は、このアカウントに引き継がれます。'):'いまは新しいアカウントを作れません。'):'';
  $('authErr').textContent='';
}
function showLogin(msg=''){$('login').hidden=false;$('app').hidden=true;setAuthMode(authMode);$('authErr').textContent=msg;}
async function submitAuth(){
  const body={email:$('a-email').value,password:$('a-pass').value,name:$('a-name').value,code:$('a-code').value};
  if(!body.email||!body.password){$('authErr').textContent='メールアドレスとパスワードを入力してください。';return;}
  $('authBtn').disabled=true;
  try{await api('/api/auth/'+(authMode==='signup'?'signup':'login'),{method:'POST',body:JSON.stringify(body)});$('a-pass').value='';await load();}
  catch(e){$('authErr').textContent=e.message;}
  $('authBtn').disabled=false;
}
async function boot(){
  try{const s=await api('/api/auth/status');signup=s.signup||signup;
    if(s.user){await load();return;}
    authMode=signup.open&&!signup.needCode?'signup':'login';showLogin();}
  catch(e){showLogin('サーバーに接続できませんでした。');}
}
async function load(){
  try{state=await api('/api/state');$('login').hidden=true;$('app').hidden=false;render();}
  catch(e){if(e.message!=='unauthorized'){$('app').hidden=false;$('login').hidden=true;render();setStatus('読み込みに失敗しました：'+e.message,true);}}
}

// ---- ネットワーク空間（脳を中心に5つの層、記憶は星として層のまわりに浮かぶ） ----
const NODES=[
  {id:'event',x:22,y:24,mx:24,my:19},
  {id:'know',x:78,y:22,mx:76,my:19},
  {id:'rel',x:14,y:60,mx:17,my:66},
  {id:'think',x:86,y:60,mx:80,my:66},
  {id:'act',x:32,y:86,mx:36,my:91},
];
const LCOL={event:'#5CD2FF',know:'#6F9BFF',think:'#B07CFF',act:'#FF6FC8',rel:'#4FE3C1'};
const LAYER_INFO={event:'起きたこと、会った人、出来事の記憶',know:'学んだこと、上司からのフィードバックや教訓',think:'アイディア、判断とその理由、価値観、まだ答えの出ていない問い',act:'タスクと目標',rel:'よく関わる人の特徴や判断基準'};
const layerOf=u=>(TYPES[u.type]||TYPES.event).layer;
const BRAIN=`<svg class="brain" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M30 11c-4-4-12-3-13 3-6 0-9 6-7 10-4 3-4 10 0 13-2 5 2 11 8 11 2 5 9 7 12 3z"/>
  <path d="M34 11c4-4 12-3 13 3 6 0 9 6 7 10 4 3 4 10 0 13 2 5-2 11-8 11-2 5-9 7-12 3z"/>
  <path d="M17 14c1 4 5 6 9 5"/><path d="M10 24c3 2 7 1 9-2"/><path d="M10 37c4-1 8 1 9 5"/><path d="M22 29c3 1 5 3 5 6"/>
  <path d="M47 14c-1 4-5 6-9 5"/><path d="M54 24c-3 2-7 1-9-2"/><path d="M54 37c-4-1-8 1-9 5"/><path d="M42 29c-3 1-5 3-5 6"/>
  <g fill="currentColor" stroke="none"><circle cx="20" cy="22" r="1.3"/><circle cx="26" cy="33" r="1.3"/><circle cx="18" cy="44" r="1.3"/><circle cx="44" cy="22" r="1.3"/><circle cx="38" cy="33" r="1.3"/><circle cx="46" cy="44" r="1.3"/><circle cx="32" cy="30" r="2"/></g>
  <path d="M20 22L26 33L18 44M44 22L38 33L46 44M26 33L32 30L38 33" stroke-width="0.8" opacity=".7"/>
</svg>`;
function renderMap(){
  const units=state.units||[];
  const cnt=id=>units.filter(u=>layerOf(u)===id).length;
  const openTasks=units.filter(u=>(u.type==='task'||u.type==='goal')&&!u.done).length;
  const label=id=>id==='act'&&openTasks?`のこり${openTasks}`:(cnt(id)?cnt(id)+'件':'');
  $('map').innerHTML=`<canvas aria-hidden="true"></canvas>

const net={raf:0,ctx:null,w:0,h:0,parts:[],stars:[],centers:{},core:null};
const still=matchMedia('(prefers-reduced-motion: reduce)');
const hash=(s,k)=>{let x=2166136261^k;for(const ch of String(s)){x^=ch.charCodeAt(0);x=Math.imul(x,16777619);}return ((x>>>0)%10000)/10000;};
function layoutNet(){
  const map=$('map');if(!map)return;const canvas=map.querySelector('canvas');if(!canvas)return;
  cancelAnimationFrame(net.raf);
  const box=map.getBoundingClientRect();const dpr=Math.min(window.devicePixelRatio||1,2);
  net.w=box.width;net.h=box.height;canvas.width=net.w*dpr;canvas.height=net.h*dpr;
  net.ctx=canvas.getContext('2d');net.ctx.setTransform(dpr,0,0,dpr,0,0);
  const center=el=>{const r=el.getBoundingClientRect();const orb=el.querySelector('.orb,.brain')||el;const o=orb.getBoundingClientRect();return{x:o.left+o.width/2-box.left,y:o.top+o.height/2-box.top,rw:r.width};};
  const coreEl=map.querySelector('.node.core');net.core=center(coreEl);
  net.centers={};map.querySelectorAll('.node[data-node]').forEach(el=>{net.centers[el.dataset.node]=center(el);});
  // 脳から各層への光るリンク
  const c=net.core;
  $('linkPaths').innerHTML=Object.entries(net.centers).map(([id,p],i)=>{const mx=(c.x+p.x)/2+(i%2?18:-18),my=(c.y+p.y)/2+(i%2?-12:12);
    const d=`M${c.x.toFixed(1)} ${c.y.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`;return `<path d="${d}"/><path class="flow" d="${d}"/>`;}).join('');
  map.querySelector('svg.links').setAttribute('viewBox',`0 0 ${net.w} ${net.h}`);
  // 背景の粒子
  const n=Math.min(110,Math.round(net.w*net.h/7000));
  if(net.parts.length!==n)net.parts=Array.from({length:n},()=>({x:Math.random()*net.w,y:Math.random()*net.h,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.4+.4}));
  // 記憶の星：各層のまわりに1件1つ
  const scale=Math.min(net.w,net.h);
  net.stars=[];const per={};
  for(const u of state.units||[]){const l=layerOf(u);per[l]=(per[l]||0)+1;if(per[l]>45)continue;
    net.stars.push({layer:l,a:hash(u.id,1)*Math.PI*2,rad:scale*(.07+hash(u.id,2)*.09),size:1.6+(u.importance||2)*.6+Math.min(u.count||1,4)*.4,spd:(hash(u.id,3)-.5)*.004,done:u.done});}

}
function drawNet(){
  const g=net.ctx;if(!g)return;const{w,h,parts,stars,centers}=net;g.clearRect(0,0,w,h);
  for(let i=0;i<parts.length;i++){const a=parts[i];for(let j=i+1;j<parts.length;j++){const b=parts[j];const dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;
    if(d<110*110){g.strokeStyle=`rgba(120,160,255,${(1-Math.sqrt(d)/110)*.28})`;g.lineWidth=.6;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();}}}
  for(const p of parts){g.fillStyle='rgba(190,215,255,.75)';g.beginPath();g.arc(p.x,p.y,p.r,0,Math.PI*2);g.fill();}
  for(const s of stars){const c=centers[s.layer];if(!c)continue;const x=c.x+Math.cos(s.a)*s.rad,y=c.y+Math.sin(s.a)*s.rad*.8;
    g.strokeStyle=LCOL[s.layer]+'55';g.lineWidth=.8;g.beginPath();g.moveTo(c.x,c.y);g.lineTo(x,y);g.stroke();
    g.shadowColor=LCOL[s.layer];g.shadowBlur=10;g.fillStyle=s.done?'rgba(200,210,235,.5)':LCOL[s.layer];g.beginPath();g.arc(x,y,s.size,0,Math.PI*2);g.fill();g.shadowBlur=0;}
}
function loopNet(){
  for(const p of net.parts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>net.w)p.vx*=-1;if(p.y<0||p.y>net.h)p.vy*=-1;}
  for(const s of net.stars)s.a+=s.spd;

document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(net.raf);else if(!still.matches){cancelAnimationFrame(net.raf);loopNet();}});

async function toggleRecord(){

    recorder=new MediaRecorder(stream,type?{mimeType:type}:undefined);chunks=[];
    recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
    recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());clearInterval(recTimer);
      const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});
      $('recbtn').classList.remove('on');$('reclabel').textContent='録音をはじめる';
      sendAudio(blob,(recorder.mimeType||'').includes('mp4')?'recording.m4a':'recording.webm');};

function toggleLive(){

// ---- アップロードの進み具合 ----
const STAGES=[{id:'upload',label:'送信'},{id:'convert',label:'変換'},{id:'ai',label:'文字起こし・要約'},{id:'save',label:'振り分け'}];
let prog=null;
function progressHTML(name,size){
  return `<div class="prog" id="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="アップロードの進み具合">
    <div class="prog-file"><span>${esc(name)}</span><span>${(size/1024/1024).toFixed(1)}MB</span></div>
    <div class="prog-bar"><span id="prog-fill"></span></div>
    <div class="prog-row"><span id="prog-label">アップロード中 0%</span><span id="prog-time"></span></div>
    <ol class="prog-steps">${STAGES.map(s=>`<li data-step="${s.id}">${s.label}</li>`).join('')}</ol></div>`;
}
function setProg(pct,label){
  if(!prog)return;prog.pct=Math.max(prog.pct,Math.min(100,pct));
  const f=$('prog-fill'),l=$('prog-label'),bar=$('prog');
  if(f)f.style.width=prog.pct.toFixed(1)+'%';if(bar)bar.setAttribute('aria-valuenow',Math.round(prog.pct));if(l&&label)l.textContent=label;
}
function setStep(id){
  if(!prog)return;prog.stage=id;prog.stageAt=Date.now();const idx=STAGES.findIndex(s=>s.id===id);
  document.querySelectorAll('.prog-steps li').forEach((li,i)=>{li.className=i<idx?'done':i===idx?'now':'';});
}
function tickProg(){
  if(!prog)return;const s=Math.floor((Date.now()-prog.start)/1000);const t=$('prog-time');if(t)t.textContent=`経過 ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  if(prog.stage==='ai'){const est=prog.est||30;const e=(Date.now()-prog.stageAt)/1000;
    setProg(42+48*(1-Math.exp(-e/est)),`文字起こしと要約をしています（目安 ${est<60?'1分以内':Math.round(est/60)+'分ほど'}）`);}
}
function uploadVoice(fd,onUp,onLine){
  return new Promise((resolve,reject)=>{
    const x=new XMLHttpRequest();x.open('POST','/api/voice');x.setRequestHeader('Accept','application/x-ndjson');
    let seen=0,buf='';
    const read=()=>{buf+=x.responseText.slice(seen);seen=x.responseText.length;let i;
      while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i);buf=buf.slice(i+1);if(line.trim()){try{onLine(JSON.parse(line));}catch(_){}}}};
    x.upload.onprogress=e=>{if(e.lengthComputable)onUp(e.loaded/e.total);};
    x.upload.onload=()=>onUp(1);
    x.onprogress=read;
    x.onload=()=>{
      if(x.status===401){showLogin('ログインが切れました。もう一度ログインしてください。');return reject(new Error('unauthorized'));}
      if(x.status>=400){let m='アップロードに失敗しました';try{m=JSON.parse(x.responseText).error||m;}catch(_){}return reject(new Error(m));}
      read();resolve();
    };
    x.onerror=()=>reject(new Error('通信が切れました。電波のよい場所でもう一度お試しください。'));
    x.send(fd);
  });
}
async function sendAudio(blob,name){
  if(busy)return;
  if(blob.size>100*1024*1024){setStatus('ファイルが大きすぎます（100MBまで）。',true);return;}
  busy=true;const t=$('timer');if(t)t.textContent='';setStatus('');
  document.querySelectorAll('#recbtn,#pick').forEach(b=>b.disabled=true);
  ui.result=null;const box=$('result');if(box)box.innerHTML=progressHTML(name,blob.size);
  prog={pct:0,start:Date.now(),stage:'upload',stageAt:Date.now(),est:30,timer:null};setStep('upload');
  prog.timer=setInterval(tickProg,300);
  let result=null,failure=null;
  try{
    const fd=new FormData();fd.append('file',blob,name);
    await uploadVoice(fd,
      p=>{if(prog.stage==='upload')setProg(p*30,p<1?`アップロード中 ${Math.round(p*100)}%`:'アップロードが終わりました');},
      m=>{
        if(m.stage==='received'){setProg(32,'サーバーで受け取りました');}
        else if(m.stage==='convert'){setStep('convert');setProg(35,'音声を変換しています');}
        else if(m.stage==='ai'){setStep('ai');prog.est=Math.max(15,15+(m.minutes||1)*6);setProg(42,'文字起こしと要約をしています');}
        else if(m.stage==='save'){setStep('save');setProg(93,'記憶に振り分けています');}
        else if(m.stage==='done'){result=m.result;}
        else if(m.stage==='error'){failure=m.error;}
      });
    if(failure)throw new Error(failure);
    if(!result)throw new Error('処理の結果を受け取れませんでした。「最近の録音」に入っていないか確認してください。');
    setStep('done');setProg(100,'完了しました');
    document.querySelectorAll('.prog-steps li').forEach(li=>li.className='done');
    ui.result=result;clearInterval(prog.timer);prog=null;
    setStatus('記憶に残しました。');await load();
  }catch(e){
    if(prog){clearInterval(prog.timer);prog=null;}
    if(e.message!=='unauthorized'){setStatus(e.message,true);render();}
  }
  busy=false;
}

async function remember(){
  if(busy)return;const text=$('input').value.trim();
  if(!text){setStatus('残す内容を入力してください。',true);$('input').focus();return;}
  busy=true;$('save').disabled=true;setStatus('保存しています…');
  try{const r=await api('/api/memos',{method:'POST',body:JSON.stringify({text})});$('input').value='';
    setStatus(r.pending?'原本を保存しました。Claudeとの会話で「knowkinの未整理メモを整理して」と頼むと、分類されて記憶に入ります。':r.error?r.error+'。「見直し」から分類し直せます。':`${r.added}件の記憶を残しました${r.repeated?`。${r.repeated}件は前にもあった内容なので、重みを上げました`:''}。`,!!r.error);
    await load();}
  catch(e){if(e.message!=='unauthorized')setStatus('保存に失敗しました：'+e.message,true);}
  busy=false;const s=$('save');if(s)s.disabled=false;
}
function setupMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const btn=$('mic');if(!SR||!btn)return;btn.hidden=false;
  let rec=null,listening=false;
  btn.addEventListener('click',()=>{
    if(listening){rec.stop();return;}
    const input=$('input');const base=input.value;const sep=base&&!base.endsWith('\n')?'\n':'';let fin='';
    try{rec=new SR();}catch(_){setStatus('マイクを使えません。キーボードの音声入力で話してください。',true);return;}
    rec.lang='ja-JP';rec.continuous=true;rec.interimResults=true;
    rec.onresult=ev=>{let interim='';for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal)fin+=r[0].transcript;else interim+=r[0].transcript;}input.value=base+sep+fin+interim;};
    rec.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed')setStatus('マイクの使用が許可されていません。キーボードの音声入力で話してください。',true);};
    rec.onend=()=>{listening=false;btn.textContent='話して入力';btn.classList.remove('on');};
    try{rec.start();listening=true;btn.textContent='止める';btn.classList.add('on');}catch(_){setStatus('マイクを開始できませんでした。',true);}
  });
}

// ---- 一覧系 ----
function unitHTML(u,{review=false}={}){
  const t=TYPES[u.type]||TYPES.event;const meta=[];
  if(u.due)meta.push(`期限 ${esc(u.due)}`);
  if((u.people||[]).length)meta.push(esc(u.people.join('、')));
  if((u.tags||[]).length)meta.push(esc(u.tags.map(x=>'#'+x).join(' ')));
  if((u.count||1)>1)meta.push(`${u.count}回目`);
  if(u.importance===3)meta.push('重要');
  meta.push(esc(u.day||''));
  const isTask=u.type==='task'||u.type==='goal';let actions='';
  if(review){const opts=Object.entries(TYPES).map(([k,v])=>`<option value="${k}"${k===u.type?' selected':''}>${v.label}</option>`).join('');const armed=ui.armed===u.id;
    actions=`<div class="row-actions"><select data-retype="${u.id}" aria-label="種類を変える">${opts}</select><button data-ok="${u.id}">確認済みにする</button><button class="del${armed?' armed':''}" data-del="${u.id}">${armed?'もう一度押すと削除':'削除'}</button></div>`;}
  return `<li class="item${u.done?' done':''}">${isTask&&!review?`<input type="checkbox" class="check" data-done="${u.id}" ${u.done?'checked':''} aria-label="完了にする">`:''}
    <div class="body"><div class="type" style="color:var(--l-${t.layer})">${t.label}</div><p class="content">${esc(u.content)}</p>
    ${u.quote?`<p class="quote">「${esc(u.quote)}」</p>`:''}${u.reason?`<p class="quote">理由：${esc(u.reason)}</p>`:''}
    <div class="meta">${meta.map(m=>`<span>${m}</span>`).join('')}</div>${actions}</div></li>`;
}
function renderLayer(p){
  const l=LAYERS.find(x=>x.id===ui.layer)||LAYERS[0];
  p.innerHTML=`<h2>${l.label}</h2><p class="lead">${LAYER_INFO[l.id]}</p>
    <input class="search" id="q" type="search" placeholder="人・会社・テーマで探す" aria-label="${l.label}の記憶を探す"><div id="memlist"></div>`;
  const qi=$('q');qi.value=ui.q;qi.addEventListener('input',e=>{ui.q=e.target.value;renderMemList();});
  renderMemList();
}
function renderMemList(){
  const box=$('memlist');if(!box)return;const q=ui.q.trim().toLowerCase();
  let list=state.units.filter(u=>layerOf(u)===ui.layer);
  if(q)list=list.filter(u=>[u.content,u.quote,u.reason,...(u.people||[]),...(u.tags||[])].join(' ').toLowerCase().includes(q));
  if(ui.layer==='act'){
    const open=list.filter(u=>!u.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));
    const done=list.filter(u=>u.done).sort((a,b)=>String(b.done_at||'').localeCompare(String(a.done_at||''))).slice(0,10);
    box.innerHTML=(open.length?`<ul class="list">${open.map(u=>unitHTML(u)).join('')}</ul>`:`<p class="empty">未完了のタスクはありません。</p>`)+(done.length?`<h4>最近終わったもの</h4><ul class="list">${done.map(u=>unitHTML(u)).join('')}</ul>`:'');
    return;
  }
  box.innerHTML=list.length?`<ul class="list">${list.slice(0,200).map(u=>unitHTML(u)).join('')}</ul>`:`<p class="empty">${q?'条件に合う記憶はありません。':'まだこの層の記憶はありません。真ん中の「記憶」から残してください。'}</p>`;
}
function renderReview(p){
  const unreviewed=state.units.filter(u=>!u.reviewed);const failed=state.failed||[];let html=`<h2>見直し</h2>`;
  if(failed.length)html+=state.aiEnabled
    ?`<h4>分類できなかったメモ</h4><ul class="list">${failed.map(m=>`<li class="item"><div class="body"><p class="content">${esc(m.text)}</p><div class="row-actions"><button data-reclass="${m.id}">分類し直す</button></div></div></li>`).join('')}</ul>`
    :`<h4>未整理のメモ（${failed.length}件）</h4><p class="lead">Claudeとの会話で「knowkinの未整理メモを整理して」と頼むと、分類されて記憶に入ります。</p><ul class="list">${failed.map(m=>`<li class="item"><div class="body"><p class="content">${esc(m.text)}</p></div></li>`).join('')}</ul>`;
  if(unreviewed.length)html+=`<div class="actions" style="justify-content:space-between;margin-top:8px"><span class="lead" style="margin:0">分類を確認して、違うものは直してください。</span><button class="ghost" id="okall">全部確認済みにする</button></div><ul class="list">${unreviewed.map(u=>unitHTML(u,{review:true})).join('')}</ul>`;
  if(!failed.length&&!unreviewed.length)html+=`<p class="empty">見直すものはありません。週に1回ここを開いて、分類を確認するのがおすすめです。</p>`;
  p.innerHTML=html;
}
function renderCore(p){
  const core=state.core;const sec=(title,arr)=>arr&&arr.length?`<h4>${title}</h4><ul>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
  let html=`<h2>核</h2>`;
  if(core)html+=`<div class="sheet core"><p class="core-summary">${esc(core.summary)}</p>`+sec('大事にしていること',core.values)+sec('判断のしかた',core.decision_rules)+sec('繰り返し学んでいること',core.lessons)+
    ((core.people||[]).length?`<h4>よく関わる人</h4><ul>${core.people.map(x=>`<li><strong>${esc(x.name)}</strong>：${esc((x.points||[]).join('／'))}</li>`).join('')}</ul>`:'')+sec('まだ答えが出ていないこと',core.open_questions)+
    `<div class="meta" style="margin-top:14px"><span>最終更新 ${esc(String(core.updatedAt||'').slice(0,10))}</span><span>${state.aiEnabled?'毎日3時にも自動で育て直します':'Claudeとの会話で「knowkinの核を育てて」と頼むと更新されます'}</span></div></div>`;
  else html+=`<p class="empty">核は、貯まった記憶からあなたの考え方をまとめたものです。教訓・判断・価値観などが3つ以上たまったら${state.aiEnabled?'育てられます':'、Claudeとの会話で「knowkinの核を育てて」と頼んでください'}。</p>`;
  html+=`<div class="actions" style="justify-content:flex-start;margin-top:16px">${state.aiEnabled?'<button class="primary" id="grow">核を育てる</button>':''}<button class="ghost" id="copy">Claudeに渡す文章を作る</button></div><div id="copyarea"></div>`;
  p.innerHTML=html;
}
async function renderAccount(p){
  p.innerHTML=`<h2>アカウント</h2><p class="lead">読み込んでいます…</p>`;
  try{ui.account=ui.account||await api('/api/account');}catch(e){if(e.message!=='unauthorized')p.innerHTML=`<h2>アカウント</h2><p class="status err">${esc(e.message)}</p>`;return;}
  const a=ui.account;if(ui.view!=='account')return;
  p.innerHTML=`<h2>アカウント</h2><p class="lead">${esc(a.user.name)}（${esc(a.user.email)}）</p>
  <div class="sheet">
    <h4 style="margin-top:0">Claude.aiのコネクタURL</h4>
    <p class="hint" style="margin:0 0 6px">Claude.aiのコネクタ設定で、カスタムコネクタとしてこのURLを登録します。パスワードと同じなので人に見せないでください。</p>
    <div class="copyrow"><input id="acc-mcp" readonly value="${esc(a.mcpUrl)}" aria-label="コネクタURL"><button class="ghost" data-copy="acc-mcp">コピー</button></div>
    <h4>iPhoneショートカット用</h4>
    <p class="hint" style="margin:0 0 6px">「URLの内容を取得」で、URLに下のアドレス、ヘッダ Authorization に「Bearer 連携キー」を入れ、フォームの file に録音を付けて送ります。</p>
    <div class="copyrow"><input id="acc-voice" readonly value="${esc(a.voiceUrl)}" aria-label="送信先URL"><button class="ghost" data-copy="acc-voice">コピー</button></div>
    <div class="copyrow"><input id="acc-key" readonly value="Bearer ${esc(a.key)}" aria-label="Authorization"><button class="ghost" data-copy="acc-key">コピー</button></div>
    <div class="actions" style="justify-content:flex-start"><button class="ghost" id="rotate">連携キーを作り直す</button></div>
  </div>
  <h4>パスワードを変える</h4>
  <div class="sheet">
    <label class="field"><span>今のパスワード</span><input id="pw-cur" type="password" autocomplete="current-password"></label>
    <label class="field"><span>新しいパスワード（8文字以上）</span><input id="pw-new" type="password" autocomplete="new-password"></label>
    <div class="actions" style="justify-content:flex-start"><button class="primary" id="pwBtn">変更する</button></div>
  </div>
  <div class="actions" style="justify-content:flex-start;margin-top:18px"><button class="ghost" id="logout">ログアウト</button></div>`;
}
const PANELS={rec:renderRec,layer:renderLayer,review:renderReview,core:renderCore,account:renderAccount};
function render(){renderMap();(PANELS[ui.view]||renderRec)($('panel'));}

// ---- 操作 ----
const patch=(id,body)=>api('/api/units/'+id,{method:'PATCH',body:JSON.stringify(body)});
const localUnit=id=>state.units.find(u=>u.id===Number(id));
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,input[type=checkbox]');if(!t)return;
  try{
    if(t.dataset.auth){setAuthMode(t.dataset.auth);return;}
    if(t.id==='authBtn'){submitAuth();return;}
    if(t.id==='logout'){await api('/api/auth/logout',{method:'POST'});state={units:[],failed:[],core:null,recordings:[]};ui.view='rec';authMode='login';showLogin();return;}
    if(t.id==='rotate'){if(ui.armed!=='rotate'){ui.armed='rotate';t.textContent='もう一度押すと作り直します（今のURLは使えなくなります）';t.classList.add('on');return;}
      ui.armed=null;await api('/api/account/rotate',{method:'POST'});ui.account=null;setStatus('連携キーを作り直しました。Claude.aiのコネクタURLも新しいものに変えてください。');render();return;}
    if(t.dataset.copy){const i=$(t.dataset.copy);i.select();try{await navigator.clipboard.writeText(i.value);t.textContent='コピーしました';setTimeout(()=>{t.textContent='コピー';},1500);}catch(_){}return;}
    if(t.id==='pwBtn'){try{await api('/api/account/password',{method:'POST',body:JSON.stringify({current:$('pw-cur').value,next:$('pw-new').value})});authMode='login';showLogin('パスワードを変えました。新しいパスワードでログインしてください。');}catch(err){setStatus(err.message,true);}return;}
    if(t.dataset.view||t.dataset.node){
      if((recorder&&recorder.state==='recording')||live){setStatus('録音中です。止めてから切り替えてください。',true);return;}
      if(prog){setStatus('アップロードの処理中です。終わるまでこのままお待ちください。',true);return;}
      if(t.dataset.node){if(ui.layer!==t.dataset.node)ui.q='';ui.view='layer';ui.layer=t.dataset.node;}else ui.view=t.dataset.view;
      ui.armed=null;if(ui.view!=='rec')ui.result=null;setStatus('');render();
      if(window.innerWidth<700)$('panel').scrollIntoView({behavior:'smooth',block:'start'});return;}
    if(t.id==='recbtn'){if(state.canSummarizeAudio||state.canTranscribe)toggleRecord();else toggleLive();return;}
    if(t.id==='vsave'){saveVoiceText();return;}
    if(t.id==='pick'){$('file').click();return;}
    if(t.dataset.p){const i=$('input');i.value+=(i.value&&!i.value.endsWith('\n')?'\n':'')+t.dataset.p;i.focus();return;}
    if(t.id==='save'){remember();return;}
    if(t.id==='grow'){t.disabled=true;setStatus('記憶を読み直して、核をまとめています…');try{await api('/api/core/grow',{method:'POST'});setStatus('核を育てました。');await load();}catch(err){setStatus(err.message,true);t.disabled=false;}return;}
    if(t.id==='copy'){const txt=await api('/api/handoff');const area=$('copyarea');
      area.innerHTML=`<textarea class="copybox" readonly aria-label="Claudeに渡す文章">${esc(txt)}</textarea><p class="status">コネクタ未登録のClaudeで使うときは、この文章を会話の最初に貼ってください。</p>`;
      area.querySelector('textarea').select();try{await navigator.clipboard.writeText(txt);area.querySelector('.status').textContent='コピーしました。';}catch(_){}return;}
    if(t.dataset.done){const u=localUnit(t.dataset.done);u.done=t.checked;render();await patch(u.id,{done:t.checked});await load();return;}
    if(t.dataset.ok){const u=localUnit(t.dataset.ok);u.reviewed=true;render();await patch(u.id,{reviewed:true});return;}
    if(t.dataset.del){if(ui.armed!==t.dataset.del){ui.armed=t.dataset.del;render();return;}
      const id=Number(t.dataset.del);state.units=state.units.filter(u=>u.id!==id);ui.armed=null;render();await api('/api/units/'+id,{method:'DELETE'});return;}
    if(t.id==='okall'){const ids=state.units.filter(u=>!u.reviewed).map(u=>u.id);state.units.forEach(u=>u.reviewed=true);render();for(const id of ids)await patch(id,{reviewed:true});return;}
    if(t.dataset.reclass){t.disabled=true;setStatus('分類しています…');const r=await api(`/api/memos/${t.dataset.reclass}/classify`,{method:'POST'});setStatus(`${r.added}件の記憶を残しました。`);await load();return;}
  }catch(err){if(err.message!=='unauthorized')setStatus('うまくいきませんでした：'+err.message,true);}
});
document.addEventListener('change',async e=>{
  const s=e.target;if(!s.dataset||!s.dataset.retype)return;const u=localUnit(s.dataset.retype);u.type=s.value;render();
  try{await patch(u.id,{type:s.value});}catch(err){setStatus('種類の変更に失敗しました：'+err.message,true);}
});
['a-email','a-pass','a-name','a-code'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')submitAuth();}));
boot();
</script>
