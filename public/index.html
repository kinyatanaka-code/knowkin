<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>knowkin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3EC;--surface:#FFFFFF;--ink:#16372A;--muted:#587066;--line:#D2DED5;
  --accent:#1F6B45;--accent-ink:#FFFFFF;--danger:#A33A3A;--band-ink:#FFFFFF;
  --l-event:#7C9A86;--l-know:#2F7D5B;--l-think:#8C8A2E;--l-act:#1E5A4E;--l-rel:#4F8A3A;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1813;--surface:#17231C;--ink:#E2EEE6;--muted:#95AC9F;--line:#27392E;
  --accent:#6FCF97;--accent-ink:#0F1813;--danger:#E58C8C;--band-ink:#0F1813;
  --l-event:#9DBBA7;--l-know:#5FC08E;--l-think:#C9C564;--l-act:#56B3A0;--l-rel:#8CCB6B;
}}
:root[data-theme="dark"]{
  --bg:#0F1813;--surface:#17231C;--ink:#E2EEE6;--muted:#95AC9F;--line:#27392E;
  --accent:#6FCF97;--accent-ink:#0F1813;--danger:#E58C8C;--band-ink:#0F1813;
  --l-event:#9DBBA7;--l-know:#5FC08E;--l-think:#C9C564;--l-act:#56B3A0;--l-rel:#8CCB6B;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:16px;line-height:1.7}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 72px}
.brand{display:flex;align-items:center;gap:14px;color:var(--accent)}
.brand svg{width:clamp(48px,13vw,76px);height:auto;flex:none}
.mark{color:var(--ink);font-family:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;font-weight:400;font-size:clamp(46px,13vw,76px);line-height:1;letter-spacing:-.01em;margin:0}
.tagline{color:var(--muted);margin:10px 0 22px;font-size:15px}
.map{margin:0 0 20px}
.map svg{display:block;width:100%;max-width:520px;height:auto;margin:0 auto}
.map .link{stroke:var(--muted);stroke-width:2;stroke-linecap:round;opacity:.55}
.map .link.pulse{stroke:var(--accent);opacity:1;stroke-dasharray:6 8;animation:flow 1.2s linear 3}
.map .node{cursor:pointer}
.map .node rect{stroke:transparent;stroke-width:3;transition:opacity .2s}
.map .node.on rect{stroke:var(--ink)}
.map .node.dim{opacity:.35}
.map .node text{fill:var(--band-ink);font-weight:700}
.map .node .cnt{font-family:"Dela Gothic One",sans-serif;font-weight:400}
.map .hub rect{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.map .hub text{fill:var(--ink);font-weight:700}
.map .hub .cnt{fill:var(--accent);font-family:"Dela Gothic One",sans-serif;font-weight:400}
.map .node:focus-visible rect{stroke:var(--accent)}
@keyframes flow{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){.map .link.pulse{animation:none}}
.drop{outline:2px dashed var(--accent);outline-offset:4px}
.composer{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px}
.composer textarea{display:block;width:100%;min-height:128px;border:0;background:transparent;resize:vertical;outline:none;line-height:1.7}
.composer textarea::placeholder{color:var(--muted)}
.prompts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 12px;font-size:13px;color:var(--muted)}
.chip:hover{color:var(--ink);border-color:var(--muted)}
.actions{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 20px;font-weight:700}
.primary:disabled{opacity:.5;cursor:default}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.ghost.on{border-color:var(--danger);color:var(--danger)}
.status{font-size:14px;color:var(--muted);margin:10px 2px 0;min-height:1.7em}
.status.err{color:var(--danger)}
nav{display:flex;gap:22px;margin:36px 0 4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;padding:8px 0;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
nav .badge{font-size:12px;margin-left:4px}
.search{width:100%;margin:16px 0 4px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.list{list-style:none;margin:0;padding:0}
.item{padding:14px 0;border-bottom:1px solid var(--line);display:flex;gap:12px}
.item .body{flex:1;min-width:0}
.type{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.type::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.content{margin:2px 0 0;overflow-wrap:anywhere}
.quote{margin:4px 0 0;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.meta{margin:4px 0 0;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 12px}
.done .content{text-decoration:line-through;color:var(--muted)}
.check{width:20px;height:20px;margin-top:4px;accent-color:var(--accent)}
.row-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.row-actions select,.row-actions button{font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.row-actions .del.armed{color:var(--danger);border-color:var(--danger)}
.empty{color:var(--muted);padding:28px 0}
h2{font-size:18px;margin:28px 0 6px}
h3{font-size:15px;margin:22px 0 4px;color:var(--muted);font-weight:500}
.core-summary{font-size:20px;line-height:1.6;margin:18px 0 0;font-weight:500}
.core ul{margin:4px 0 0;padding-left:1.2em}
.core li{margin:2px 0}
.copybox{width:100%;min-height:160px;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px;font-size:13px}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M30 11c-4-4-12-3-13 3-6 0-9 6-7 10-4 3-4 10 0 13-2 5 2 11 8 11 2 5 9 7 12 3z"/>
      <path d="M34 11c4-4 12-3 13 3 6 0 9 6 7 10 4 3 4 10 0 13 2 5-2 11-8 11-2 5-9 7-12 3z"/>
      <path d="M17 14c1 4 5 6 9 5"/><path d="M10 24c3 2 7 1 9-2"/><path d="M10 37c4-1 8 1 9 5"/><path d="M22 29c3 1 5 3 5 6"/>
      <path d="M47 14c-1 4-5 6-9 5"/><path d="M54 24c-3 2-7 1-9-2"/><path d="M54 37c-4-1-8 1-9 5"/><path d="M42 29c-3 1-5 3-5 6"/>
    </svg>
    <h1 class="mark">knowkin</h1>
  </div>
  <p class="tagline">脳筋でも大丈夫。覚えるのは、こっちでやる。</p>

  <div class="map" id="map" role="group" aria-label="記憶から5つの層への広がり。層を押すと絞り込めます"></div>

  <div id="login" class="notice" hidden>
    <p style="margin:0 0 10px;color:var(--ink)">ログイン用のトークン（APP_TOKEN）を入力してください。</p>
    <input id="tokenInput" class="search" type="password" autocomplete="current-password" aria-label="トークン" style="margin:0 0 10px">
    <div class="actions" style="justify-content:flex-start"><button class="primary" type="button" id="loginBtn">ログイン</button></div>
    <p class="status err" id="loginErr"></p>
  </div>

  <section id="app" hidden>
    <div class="composer">
      <div class="prompts" id="prompts">
        <button class="chip" type="button" data-p="今日あったこと：">今日、何があったか</button>
        <button class="chip" type="button" data-p="決めたことと理由：">何を決めて、なぜか</button>
        <button class="chip" type="button" data-p="学んだこと・気になっていること：">何を学んだか</button>
      </div>
      <label for="input" class="sr" style="position:absolute;left:-9999px">メモ</label>
      <textarea id="input" placeholder="話すように書くか、メモやホワイトボードの写真を入れてください。上司に言われたこと、思いついたこと、やることが混ざっていても大丈夫です。"></textarea>
      <div class="actions">
        <input type="file" id="file" accept="image/*,audio/*,.txt,.md,text/plain" hidden>
        <button class="ghost" type="button" id="upload">メモ・写真を入れる</button>
        <button class="ghost" type="button" id="mic" hidden>話して入力</button>
        <button class="primary" type="button" id="save">脳に残す</button>
      </div>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <nav role="tablist">
      <button role="tab" data-tab="mem" aria-selected="true">記憶</button>
      <button role="tab" data-tab="task" aria-selected="false">タスク<span class="badge" id="b-task"></span></button>
      <button role="tab" data-tab="review" aria-selected="false">見直し<span class="badge" id="b-review"></span></button>
      <button role="tab" data-tab="core" aria-selected="false">核</button>
    </nav>
    <div id="view"></div>
  </section>
</div>

<script>
const TYPES={event:{label:'記憶',layer:'event'},input:{label:'インプット',layer:'know'},lesson:{label:'フィードバック・教訓',layer:'know'},idea:{label:'アイディア',layer:'think'},decision:{label:'判断と理由',layer:'think'},value:{label:'価値観',layer:'think'},question:{label:'未解決の問い',layer:'think'},task:{label:'タスク',layer:'act'},goal:{label:'目標',layer:'act'},person:{label:'人物',layer:'rel'}};
const LAYERS=[{id:'event',label:'出来事'},{id:'know',label:'知識'},{id:'think',label:'思考'},{id:'act',label:'行動'},{id:'rel',label:'関係'}];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token='';try{token=localStorage.getItem('knowkin_token')||'';}catch(_){}
let state={units:[],failed:[],core:null};
const ui={tab:'mem',layer:null,q:'',armed:null};
let busy=false;

function setStatus(t,err=false){const s=$('status');s.textContent=t;s.classList.toggle('err',err);}
async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...(opts.headers||{})}});
  if(r.status===401){showLogin('トークンが違います。もう一度入力してください。');throw new Error('unauthorized');}
  const body=r.headers.get('content-type')?.includes('json')?await r.json():await r.text();
  if(!r.ok)throw new Error(body.error||'通信に失敗しました');
  return body;
}
function showLogin(msg=''){$('login').hidden=false;$('app').hidden=true;$('loginErr').textContent=msg;$('tokenInput').focus();}
async function load(){
  try{state=await api('/api/state');$('login').hidden=true;$('app').hidden=false;render();}
  catch(e){if(e.message!=='unauthorized')setStatus('読み込みに失敗しました：'+e.message,true);}
}

function renderStrata(){
  const counts=Object.fromEntries(LAYERS.map(l=>[l.id,0]));
  state.units.forEach(u=>counts[(TYPES[u.type]||TYPES.event).layer]++);
  $('strata').innerHTML=LAYERS.map(l=>{const n=counts[l.id];const h=34+Math.round(10*Math.log2(n+1));const on=ui.layer===l.id;
    return `<button class="stratum${ui.layer&&!on?' dim':''}" data-layer="${l.id}" aria-pressed="${on}" style="background:var(--l-${l.id});min-height:${h}px"><span>${l.label}</span><span class="n">${n}</span></button>`;}).join('');
}
function unitHTML(u,{review=false}={}){
  const t=TYPES[u.type]||TYPES.event;const meta=[];
  if(u.due)meta.push(`期限 ${esc(u.due)}`);
  if((u.people||[]).length)meta.push(esc(u.people.join('、')));
  if((u.tags||[]).length)meta.push(esc(u.tags.map(x=>'#'+x).join(' ')));
  if((u.count||1)>1)meta.push(`${u.count}回目`);
  if(u.importance===3)meta.push('重要');
  meta.push(esc(u.day||''));
  const isTask=u.type==='task'||u.type==='goal';
  let actions='';
  if(review){
    const opts=Object.entries(TYPES).map(([k,v])=>`<option value="${k}"${k===u.type?' selected':''}>${v.label}</option>`).join('');
    const armed=ui.armed===u.id;
    actions=`<div class="row-actions"><select data-retype="${u.id}" aria-label="種類を変える">${opts}</select><button data-ok="${u.id}">確認済みにする</button><button class="del${armed?' armed':''}" data-del="${u.id}">${armed?'もう一度押すと削除':'削除'}</button></div>`;
  }
  return `<li class="item${u.done?' done':''}">${isTask&&!review?`<input type="checkbox" class="check" data-done="${u.id}" ${u.done?'checked':''} aria-label="完了にする">`:''}
    <div class="body"><div class="type" style="color:var(--l-${t.layer})">${t.label}</div><p class="content">${esc(u.content)}</p>
    ${u.quote?`<p class="quote">「${esc(u.quote)}」</p>`:''}${u.reason?`<p class="quote">理由：${esc(u.reason)}</p>`:''}
    <div class="meta">${meta.map(m=>`<span>${m}</span>`).join('')}</div>${actions}</div></li>`;
}
function renderMemList(){
  const box=$('memlist');if(!box)return;const q=ui.q.trim().toLowerCase();
  let list=state.units.filter(u=>!ui.layer||(TYPES[u.type]||TYPES.event).layer===ui.layer);
  if(q)list=list.filter(u=>[u.content,u.quote,u.reason,...(u.people||[]),...(u.tags||[])].join(' ').toLowerCase().includes(q));
  box.innerHTML=list.length?`<ul class="list">${list.slice(0,200).map(u=>unitHTML(u)).join('')}</ul>`:
    `<p class="empty">${state.units.length?'条件に合う記憶はありません。':'まだ記憶がありません。上の欄に今日のことを書いて「脳に残す」を押してください。'}</p>`;
}
function renderView(){
  const v=$('view');const units=state.units;
  const openTasks=units.filter(u=>(u.type==='task'||u.type==='goal')&&!u.done);
  const unreviewed=units.filter(u=>!u.reviewed);const failed=state.failed||[];
  $('b-task').textContent=openTasks.length||'';
  $('b-review').textContent=(unreviewed.length+failed.length)||'';
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===ui.tab));
  if(ui.tab==='mem'){
    if(!$('q')){v.innerHTML=`<input class="search" id="q" type="search" placeholder="人・会社・テーマで探す" aria-label="記憶を探す"><div id="memlist"></div>`;
      const qi=$('q');qi.value=ui.q;qi.addEventListener('input',e=>{ui.q=e.target.value;renderMemList();});}
    renderMemList();
  }else if(ui.tab==='task'){
    const byDue=(a,b)=>(a.due||'9999').localeCompare(b.due||'9999');
    const done=units.filter(u=>(u.type==='task'||u.type==='goal')&&u.done).sort((a,b)=>String(b.done_at||'').localeCompare(String(a.done_at||''))).slice(0,10);
    v.innerHTML=(openTasks.length?`<ul class="list">${openTasks.sort(byDue).map(u=>unitHTML(u)).join('')}</ul>`:`<p class="empty">未完了のタスクはありません。</p>`)+
      (done.length?`<h3>最近終わったもの</h3><ul class="list">${done.map(u=>unitHTML(u)).join('')}</ul>`:'');
  }else if(ui.tab==='review'){
    let html='';
    if(failed.length)html+=state.aiEnabled
      ?`<h3>分類できなかったメモ</h3><ul class="list">${failed.map(m=>`<li class="item"><div class="body"><p class="content">${esc(m.text)}</p><div class="row-actions"><button data-reclass="${m.id}">分類し直す</button></div></div></li>`).join('')}</ul>`
      :`<h3>未整理のメモ（${failed.length}件）</h3><p style="color:var(--muted);font-size:14px;margin:0">Claudeとの会話で「knowkinの未整理メモを整理して」と頼むと、分類されて記憶に入ります。</p><ul class="list">${failed.map(m=>`<li class="item"><div class="body"><p class="content">${esc(m.text)}</p></div></li>`).join('')}</ul>`;
    if(unreviewed.length)html+=`<div class="actions" style="justify-content:space-between;margin-top:16px"><span style="color:var(--muted);font-size:14px">Claudeの分類を確認して、違うものは直してください。</span><button class="ghost" id="okall">全部確認済みにする</button></div><ul class="list">${unreviewed.map(u=>unitHTML(u,{review:true})).join('')}</ul>`;
    v.innerHTML=html||`<p class="empty">見直すものはありません。週に1回ここを開いて、分類を確認するのがおすすめです。</p>`;
  }else renderCore(v);
}
function renderCore(v){
  const core=state.core;const sec=(title,arr)=>arr&&arr.length?`<h3>${title}</h3><ul>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
  let html='';
  if(core){html+=`<div class="core"><p class="core-summary">${esc(core.summary)}</p>`+sec('大事にしていること',core.values)+sec('判断のしかた',core.decision_rules)+sec('繰り返し学んでいること',core.lessons)+
    ((core.people||[]).length?`<h3>よく関わる人</h3><ul>${core.people.map(p=>`<li><strong>${esc(p.name)}</strong>：${esc((p.points||[]).join('／'))}</li>`).join('')}</ul>`:'')+
    sec('まだ答えが出ていないこと',core.open_questions)+`<p class="meta" style="margin-top:14px">最終更新 ${esc(String(core.updatedAt||'').slice(0,10))}　${state.aiEnabled?'毎日3時にも自動で育て直します':'Claudeとの会話で「knowkinの核を育てて」と頼むと更新されます'}</p></div>`;}
  else html+=`<p class="empty">核は、貯まった記憶からあなたの考え方をまとめたものです。教訓・判断・価値観などが3つ以上たまったら${state.aiEnabled?'育てられます':'、Claudeとの会話で「knowkinの核を育てて」と頼んでください'}。</p>`;
  html+=`<div class="actions" style="justify-content:flex-start;margin-top:18px">${state.aiEnabled?'<button class="primary" id="grow">核を育てる</button>':''}<button class="ghost" id="copy">Claudeに渡す文章を作る</button><button class="ghost" id="logout">ログアウト</button></div><div id="copyarea"></div>`;
  v.innerHTML=html;
}
function render(){renderStrata();renderView();}

async function remember(){
  if(busy)return;const text=$('input').value.trim();
  if(!text){setStatus('残す内容を入力してください。',true);$('input').focus();return;}
  busy=true;$('save').disabled=true;setStatus('保存して、Claudeが分類しています…');
  try{const r=await api('/api/memos',{method:'POST',body:JSON.stringify({text})});$('input').value='';
    setStatus(r.pending?'原本を保存しました。Claudeとの会話で「knowkinの未整理メモを整理して」と頼むと、分類されて記憶に入ります。':r.error?r.error+'。「見直し」から分類し直せます。':`${r.added}件の記憶を残しました${r.repeated?`。${r.repeated}件は前にもあった内容なので、重みを上げました`:''}。`,!!r.error);
    await load();}
  catch(e){if(e.message!=='unauthorized')setStatus('保存に失敗しました：'+e.message,true);}
  busy=false;$('save').disabled=false;
}
const patch=(id,body)=>api('/api/units/'+id,{method:'PATCH',body:JSON.stringify(body)});
function localUnit(id){return state.units.find(u=>u.id===Number(id));}

document.addEventListener('click',async e=>{
  const t=e.target.closest('button,input[type=checkbox]');if(!t)return;
  try{
    if(t.id==='loginBtn'){token=$('tokenInput').value.trim();try{localStorage.setItem('knowkin_token',token);}catch(_){}load();return;}
    if(t.id==='logout'){token='';try{localStorage.removeItem('knowkin_token');}catch(_){}showLogin();return;}
    if(t.dataset.layer){ui.layer=ui.layer===t.dataset.layer?null:t.dataset.layer;if(ui.tab!=='mem'){ui.tab='mem';}render();return;}
    if(t.dataset.tab){ui.tab=t.dataset.tab;ui.armed=null;renderView();return;}
    if(t.dataset.p){const i=$('input');i.value+=(i.value&&!i.value.endsWith('\n')?'\n':'')+t.dataset.p;i.focus();return;}
    if(t.id==='save'){remember();return;}
    if(t.id==='grow'){t.disabled=true;setStatus('記憶を読み直して、核をまとめています…');try{await api('/api/core/grow',{method:'POST'});setStatus('核を育てました。');await load();}catch(err){setStatus(err.message,true);t.disabled=false;}return;}
    if(t.id==='copy'){const txt=await api('/api/handoff');const area=$('copyarea');
      area.innerHTML=`<textarea class="copybox" readonly aria-label="Claudeに渡す文章">${esc(txt)}</textarea><p class="status">コネクタ未登録のClaudeで使うときは、この文章を会話の最初に貼ってください。</p>`;
      area.querySelector('textarea').select();try{await navigator.clipboard.writeText(txt);area.querySelector('.status').textContent='コピーしました。';}catch(_){}return;}
    if(t.dataset.done){const u=localUnit(t.dataset.done);u.done=t.checked;render();await patch(u.id,{done:t.checked});await load();return;}
    if(t.dataset.ok){const u=localUnit(t.dataset.ok);u.reviewed=true;render();await patch(u.id,{reviewed:true});return;}
    if(t.dataset.del){if(ui.armed!==t.dataset.del){ui.armed=t.dataset.del;renderView();return;}
      const id=Number(t.dataset.del);state.units=state.units.filter(u=>u.id!==id);ui.armed=null;render();await api('/api/units/'+id,{method:'DELETE'});return;}
    if(t.id==='okall'){const ids=state.units.filter(u=>!u.reviewed).map(u=>u.id);state.units.forEach(u=>u.reviewed=true);render();for(const id of ids)await patch(id,{reviewed:true});return;}
    if(t.dataset.reclass){t.disabled=true;setStatus('分類しています…');const r=await api(`/api/memos/${t.dataset.reclass}/classify`,{method:'POST'});setStatus(`${r.added}件の記憶を残しました。`);await load();return;}
  }catch(err){if(err.message!=='unauthorized')setStatus('うまくいきませんでした：'+err.message,true);}
});
document.addEventListener('change',async e=>{
  const s=e.target;if(!s.dataset||!s.dataset.retype)return;const u=localUnit(s.dataset.retype);u.type=s.value;render();
  try{await patch(u.id,{type:s.value});}catch(err){setStatus('種類の変更に失敗しました：'+err.message,true);}
});
$('input').addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')remember();});
$('tokenInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click();});

(function setupMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const btn=$('mic');if(!SR)return;btn.hidden=false;
  let rec=null,listening=false;
  btn.addEventListener('click',()=>{
    if(listening){rec.stop();return;}
    const input=$('input');const base=input.value;const sep=base&&!base.endsWith('\n')?'\n':'';let fin='';
    try{rec=new SR();}catch(_){setStatus('マイクを使えません。キーボードの音声入力で話してください。',true);return;}
    rec.lang='ja-JP';rec.continuous=true;rec.interimResults=true;
    rec.onresult=ev=>{let interim='';for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal)fin+=r[0].transcript;else interim+=r[0].transcript;}input.value=base+sep+fin+interim;};
    rec.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed')setStatus('マイクの使用が許可されていません。ブラウザの設定を確認するか、キーボードの音声入力で話してください。',true);};
    rec.onend=()=>{listening=false;btn.textContent='話して入力';btn.classList.remove('on');};
    try{rec.start();listening=true;btn.textContent='止める';btn.classList.add('on');setStatus('聞いています。話し終わったら「止める」を押してください。');}catch(_){setStatus('マイクを開始できませんでした。',true);}
  });
})();

if(token)load();else showLogin();
</script>
