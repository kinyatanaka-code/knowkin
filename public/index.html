<html lang="ja">
<head>
<meta charset="utf-8">

<style>
:root{
  --bg:#050A1C;--bg2:#0A1330;--surface:#0D1736;--surface2:#122046;--ink:#E7EDFF;--muted:#94A3CC;--line:#22305C;
  --cyan:#5CD2FF;--violet:#9B7CFF;--pink:#FF6FC8;--accent:#5CD2FF;--accent-ink:#04101F;--red:#FF7A9A;
  --l-event:#5CD2FF;--l-know:#6F9BFF;--l-think:#B07CFF;--l-act:#FF6FC8;--l-rel:#4FE3C1;
  color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050A1C}}
:root[data-theme="dark"]{--bg:#050A1C}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Zen Kaku Gothic New",-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:16px;line-height:1.7;
  background:radial-gradient(1200px 700px at 50% 0%,#12235A 0%,var(--bg) 60%) fixed,var(--bg)}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;padding:22px 16px 72px}
.brand{display:flex;align-items:center;gap:12px;color:var(--cyan)}
.brand img{width:40px;height:40px;flex:none}
.mark{font-family:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;font-weight:400;font-size:34px;line-height:1;margin:0;color:var(--ink);letter-spacing:.01em}
.tagline{color:var(--muted);margin:6px 0 16px;font-size:14px}

.space{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(60% 55% at 50% 50%,#1B2E72 0%,#0B1437 55%,#050A1C 100%)}
.space-head{position:absolute;left:18px;right:18px;top:14px;display:flex;justify-content:space-between;align-items:baseline;z-index:3;pointer-events:none}
.space-title{margin:0;font-size:15px;font-weight:500;color:var(--muted);letter-spacing:.08em}
.space-date{font-size:14px;color:var(--muted)}
.map{position:relative;aspect-ratio:16/10;min-height:380px}
@media (max-width:620px){.map{aspect-ratio:3/5.1}}
.map canvas{position:absolute;inset:0;width:100%;height:100%}
.map svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.map svg.links path{fill:none;stroke:url(#linkGrad);stroke-width:2;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(155,124,255,.9))}
.map svg.links path.flow{stroke:#fff;stroke-width:1.4;stroke-dasharray:2 22;opacity:.8;filter:none}
@media (prefers-reduced-motion:no-preference){.map svg.links path.flow{animation:flow 2.4s linear infinite}}
@keyframes flow{to{stroke-dashoffset:-48}}

.node{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);z-index:2;background:none;border:0;padding:0;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .2s}
@media (max-width:620px){.node{left:var(--mx);top:var(--my)}}
.orb{width:clamp(46px,7vw,64px);height:clamp(46px,7vw,64px);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0%,var(--c) 28%,color-mix(in srgb,var(--c) 35%,transparent) 62%,transparent 72%);
  box-shadow:0 0 18px 4px color-mix(in srgb,var(--c) 55%,transparent),0 0 44px 10px color-mix(in srgb,var(--c) 22%,transparent)}
.node .name{font-weight:700;font-size:clamp(15px,2.2vw,19px);letter-spacing:.06em;text-shadow:0 0 10px color-mix(in srgb,var(--c) 80%,transparent)}
.node .count{font-size:12px;color:var(--muted);min-height:1.2em;margin-top:-4px}
.node:hover{transform:translate(-50%,-50%) scale(1.07)}
.node[aria-pressed="true"] .orb{box-shadow:0 0 0 2px #fff,0 0 24px 8px color-mix(in srgb,var(--c) 70%,transparent),0 0 60px 16px color-mix(in srgb,var(--c) 30%,transparent)}
.node.core{gap:2px}
.node.core .brain{width:clamp(110px,17vw,168px);height:auto;color:#BDEBFF;
  filter:drop-shadow(0 0 6px #5CD2FF) drop-shadow(0 0 22px rgba(92,210,255,.75)) drop-shadow(0 0 48px rgba(176,124,255,.55))}
@media (prefers-reduced-motion:no-preference){.node.core .brain{animation:pulse 3.2s ease-in-out infinite}}
@keyframes pulse{0%,100%{opacity:.88}50%{opacity:1}}
.node.core .name,.node.core .count{background:rgba(6,12,34,.72);border-radius:10px;padding:0 10px}
.node.core .name{font-size:clamp(20px,3vw,26px);text-shadow:0 0 14px rgba(92,210,255,.9)}
.node.core .count{color:var(--cyan)}
.node.core[aria-pressed="true"] .brain{color:#fff}

.goal{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);z-index:2;background:none;border:0;padding:0;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px;max-width:34%;transition:transform .2s}
.goal:hover{transform:translate(-50%,-50%) scale(1.07)}
@media (max-width:620px){.goal{left:var(--mx);top:var(--my)}}
.sw{filter:drop-shadow(0 0 5px var(--sc)) drop-shadow(0 0 14px var(--sc));opacity:var(--o);line-height:0}
.star{display:block;width:var(--s);height:var(--s);background:radial-gradient(circle,#fff 0 18%,var(--sc) 45%);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
.goal .gname{font-size:12px;font-weight:700;text-align:center;line-height:1.35;text-shadow:0 0 8px rgba(0,0,0,.8)}
.goal .gpct{font-size:11px;color:var(--sc)}
.goal .gpct.stall{color:#FFB86B}
.goal-hint{position:absolute;left:50%;top:13%;transform:translate(-50%,-50%);z-index:2;font-size:12px;color:var(--muted);background:none;border:1px dashed var(--line);border-radius:999px;padding:4px 12px}
.gpath{position:relative;height:18px;margin:10px 4px 0}
.gpath .base{position:absolute;top:8px;left:0;right:8%;height:2px;background:var(--line)}
.gpath::before{content:'';position:absolute;top:4px;left:0;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--gc)}
.gpath .fill{position:absolute;top:8px;left:0;height:2px;background:var(--gc)}
.gpath .ms{position:absolute;top:4px;width:10px;height:10px;margin-left:-5px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface)}
.gpath .ms.done{background:var(--gc);border-color:var(--gc)}
.gpath .here{position:absolute;top:2px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;box-shadow:0 0 8px var(--gc)}
.gpath .flag{position:absolute;right:0;top:-3px;color:var(--gc);font-size:16px}
.gcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px;color:var(--ink)}
.gcard:hover{border-color:var(--gc)}
.gtop{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.gbadge{font-size:12px;padding:1px 9px;border-radius:999px;border:1px solid var(--gc);color:var(--gc)}
.gtitle{font-size:16px;font-weight:700;margin:6px 0 2px}
.gfuture{font-size:13px;color:var(--muted);margin:0}
.gnow{font-size:13px;margin:8px 0 0}.gnow b{color:var(--gc)}
.future-box{border-left:3px solid var(--gc);padding:2px 0 2px 12px;margin:10px 0 14px}
.future-box p{margin:0}.future-box .lbl{font-size:12px;color:var(--muted);margin-top:8px}
.msl{list-style:none;margin:0;padding:0}.msl li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.msl li.done span{text-decoration:line-through;color:var(--muted)}.msl .nowtag{margin-left:auto;font-size:12px;color:var(--gc)}
.goaltag{margin-left:6px;font-size:11px;font-weight:500;color:#FFD66B;border:1px solid rgba(255,214,107,.5);border-radius:999px;padding:0 6px}
.lock{overflow:hidden}
.lock #status{position:fixed;left:16px;right:16px;bottom:78px;z-index:60;margin:0;padding:9px 14px;border-radius:12px;background:#16372A;color:#fff;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.lock #status.err{background:#8A3B12;color:#fff}
.lock #status:empty{display:none}
.actview{position:fixed;inset:0;z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch;
  --bg:#FFFFFF;--bg2:#F6FAF7;--surface:#FFFFFF;--surface2:#E3EFE7;--ink:#16372A;--muted:#6B7F74;--line:#DDE8E1;--cyan:#1F7A4D;--accent-ink:#FFFFFF;--pink:#1F7A4D;--red:#B7791F;--g:#1F7A4D;--g2:#4FA57A;--soft:#EAF5EE;--l-rel:#1F7A4D;
  background:var(--bg);color:var(--ink);color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  clip-path:circle(0 at var(--ox,50%) var(--oy,50%));transition:clip-path .32s ease}
.actview.open{clip-path:circle(150% at var(--ox,50%) var(--oy,50%))}
@media (prefers-reduced-motion:reduce){.actview{transition:none}}
.av-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.av-back{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1;color:var(--ink)}
.av-orb{width:28px;height:28px;border-radius:50%;background:var(--soft);border:2px solid var(--g);display:flex;align-items:center;justify-content:center}.av-orb::after{content:'';width:11px;height:11px;border-radius:50%;background:var(--g)}
.av-top h1{margin:0;font-size:21px;letter-spacing:.06em}.av-date{margin-left:auto;font-size:13px;color:var(--muted)}
.av-body{max-width:720px;margin:0 auto;padding:6px 16px 90px}
.av-sh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}.av-sh h2{margin:0;font-size:14px;font-weight:500;color:var(--muted);letter-spacing:.1em}
.actview .linkbtn{color:var(--g)}
.av-cand{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:0 0 10px;background:var(--soft);border:1px dashed var(--g);border-radius:12px;font-size:14px}
.av-cand small{color:var(--muted)}.av-cand button{margin-left:auto;flex:none;background:var(--g);color:#fff;border:0;border-radius:8px;padding:6px 12px;font-weight:700}
.av-goals{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;margin:0 -16px;padding:2px 16px 8px}
.agc{flex:0 0 78%;max-width:340px;scroll-snap-align:start;border:1px solid var(--line);border-radius:16px;background:var(--bg);display:flex;flex-direction:column}
.agc.sel{border-color:var(--g);box-shadow:0 0 0 1px var(--g) inset;background:var(--soft)}
.agc-main{display:flex;flex-direction:column;gap:6px;text-align:left;background:none;border:0;padding:12px 14px 6px;color:var(--ink)}
.agc-top{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.agc-star{width:16px;height:16px;background:var(--g);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
.agc.life .agc-star{background:var(--g2)}
.agc-pct{margin-left:auto;font-size:16px;color:var(--g)}.agc.life .agc-pct{color:var(--g2)}
.agc-stall{color:#B7791F;margin-left:4px}
.agc-title{font-size:16px;font-weight:700}
.agc-now{font-size:12px;color:var(--muted)}.agc-now b{color:var(--g)}
.agc-foot{display:flex;align-items:center;gap:8px;padding:0 14px 10px}
.agc-more{margin-left:auto;background:none;border:0;color:var(--g);font-size:12px;padding:0}
.agc-gen{background:var(--soft);border:1px solid var(--g);color:var(--g);border-radius:999px;font-size:12px;padding:3px 10px;font-weight:700}
.agc-req{font-size:12px;color:var(--muted)}
.tprop{margin:3px 0 0;font-size:12px;color:var(--g,#6FCF97)}
.actview .gpath{--gc:var(--g)!important}.actview .agc.life .gpath{--gc:var(--g2)!important}
.actview .gpath .fill,.actview .gpath .ms.done,.actview .gpath::before{background:var(--gc)!important}.actview .gpath .ms.done{border-color:var(--gc)!important}.actview .gpath .flag{color:var(--gc)!important}
.actview .gpath .here{background:#fff;border:3px solid var(--gc);box-shadow:none;width:14px;height:14px}
.av-empty{color:var(--muted);font-size:14px}
.actview .seg{background:var(--bg2)}
.actview .seg button[aria-selected="true"]{background:var(--g);color:#fff}
.actview .seg.sub button[aria-selected="true"]{background:var(--soft);color:var(--g);box-shadow:0 0 0 1px var(--g) inset}
.actview .pnav button:not(.linkbtn){background:var(--bg)}
.actview .pcount{margin-left:auto;font-style:normal;font-size:13px;color:var(--muted)}
.actview .tbar{height:6px;border-radius:999px;background:var(--surface2);overflow:hidden;margin:0 0 12px}.actview .tbar span{display:block;height:100%;background:var(--g)}
.actview .tadd input{background:var(--bg2)}
.actview .primary{background:var(--g);color:#fff;box-shadow:none}
.actview .check{accent-color:var(--g)}
.actview .abadge.work{color:var(--g);border-color:var(--g)}.actview .abadge.life{color:var(--g2);border-color:var(--g2);background:var(--soft)}
.actview .goaltag{color:var(--g);border-color:var(--g)}
.actview .warn{color:#B7791F}
.actview h4{color:var(--muted)}
.gfilter{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:6px 12px;border-radius:999px;background:var(--soft,rgba(255,214,107,.1));color:var(--g,#FFD66B);font-size:13px;font-weight:700}
.gfilter .linkbtn{margin-left:auto;font-size:12px}
.pcount{margin-left:auto;font-style:normal;font-size:13px;color:var(--muted)}
.tbar{height:6px;border-radius:999px;background:var(--surface2);overflow:hidden;margin:0 0 12px}.tbar span{display:block;height:100%;background:var(--cyan)}
.av-tab{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;justify-content:space-around;background:var(--bg);border-top:1px solid var(--line);padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.av-tab button{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;font-size:11px;color:var(--muted);min-width:64px}
.av-tab button span{width:8px;height:8px;border-radius:50%;background:currentColor}
.av-tab .on{color:var(--g);font-weight:700}
.gr-hero{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.gr-lbl{margin:0;font-size:13px;color:var(--muted)}
.gr-big{margin:2px 0;font-size:44px;font-weight:800;line-height:1.1;color:#6FCF97}.gr-big small{font-size:20px;margin-left:2px}
.gr-sub{margin:0;font-size:12px;color:var(--muted)}
.spark{width:140px;height:36px;flex:none}
.gr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:22px}
.gr-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.gr-num{margin:0;font-size:28px;font-weight:800}.gr-num small{font-size:14px;margin-left:2px;color:var(--muted)}
.lbar{display:flex;align-items:center;gap:6px;font-size:12px}.lbar-n{width:3.5em;color:var(--muted)}.lbar-t{flex:1;height:6px;border-radius:999px;background:var(--surface2);overflow:hidden}.lbar-t span{display:block;height:100%;border-radius:999px}.lbar-c{width:2em;text-align:right}
.gr-hints{margin:0;padding-left:1.2em;color:var(--ink)}.gr-hints li{margin:4px 0}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.quiz .q{margin:0;font-weight:700}
.quiz .pred{margin:8px 0 0;padding:8px 12px;border-left:3px solid var(--violet);background:var(--bg2);border-radius:0 8px 8px 0}.quiz .pred span{display:block;font-size:12px;color:var(--muted)}
.quiz .basis{margin:6px 0 0;font-size:12px;color:var(--muted)}
.qbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.qbtns button{flex:1;min-width:90px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 6px;font-weight:700}
.magnets{display:flex;gap:10px;justify-content:flex-end;margin:12px 2px 0;flex-wrap:wrap}
.magnet{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 16px;font-size:14px;display:flex;gap:8px;align-items:center}
.magnet::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.magnet[aria-pressed="true"]{border-color:var(--cyan)}
.magnet .n{color:var(--pink);font-weight:700}

.panel{margin-top:30px}
.panel h2{font-weight:700;font-size:24px;margin:0 0 4px;color:var(--ink);letter-spacing:.04em}
.panel .lead{color:var(--muted);margin:0 0 16px;font-size:15px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.rec-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.recbtn{display:flex;align-items:center;gap:10px;border:0;border-radius:999px;background:linear-gradient(90deg,#FF5FA8,#B07CFF);color:#fff;padding:12px 22px;font-weight:700;box-shadow:0 0 18px rgba(255,95,168,.45)}
.recbtn .dot{width:12px;height:12px;border-radius:50%;background:#fff}
.recbtn.on .dot{border-radius:2px}
.timer{font-variant-numeric:tabular-nums;color:var(--muted)}
.drop{margin-top:14px;border:1.5px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--cyan);color:var(--ink)}
.drop strong{color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--cyan);text-decoration:underline;font-weight:700}
.primary{background:var(--cyan);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 20px;font-weight:700;box-shadow:0 0 14px rgba(92,210,255,.4)}
.primary:disabled,.recbtn:disabled{opacity:.45;cursor:default;box-shadow:none}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.ghost.on{border-color:var(--pink);color:var(--pink)}
.status{font-size:14px;color:var(--muted);margin:12px 2px 0;min-height:1.7em}
.status.err{color:var(--red)}
.prog{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg2)}
.prog-file{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin:0 0 8px}
.prog-file span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog-bar{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden}
.prog-bar span{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));transition:width .3s ease}
.prog-row{display:flex;justify-content:space-between;gap:10px;margin:8px 0 0;font-size:14px}
.prog-row span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog-steps{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px;color:var(--muted)}
.prog-steps li{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.prog-steps li::before{content:"";width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line)}
.prog-steps li.now{color:var(--ink)}
.prog-steps li.now::before{border-color:var(--cyan);background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
@media (prefers-reduced-motion:no-preference){.prog-steps li.now::before{animation:pulse 1.2s ease-in-out infinite}}
.prog-steps li.done{color:var(--ink)}
.prog-steps li.done::before{border-color:var(--l-rel);background:var(--l-rel)}
.drawers{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:6px}
.drawer{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;padding:12px 12px 14px;min-height:108px;color:var(--ink)}
.drawer:hover{border-color:var(--c)}
.drawer-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.drawer-name{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.drawer-n{font-size:13px;color:var(--c);font-weight:700;white-space:nowrap}
.drawer-prev{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.drawer.peri{opacity:.75;border-style:dashed}
.relbtn{font-size:12px;font-weight:500;margin-left:auto}
.back{background:none;border:0;color:var(--cyan);padding:4px 0;margin:4px 0 8px;font-weight:700}
.drawer-head{display:flex;align-items:baseline;gap:10px;border-left:3px solid var(--c);padding-left:10px;margin:0 0 4px}
.drawer-head h3{margin:0;font-size:19px}.drawer-head span{color:var(--muted);font-size:13px}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin:0 0 8px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 4px;color:var(--muted);font-weight:700}
.seg button[aria-selected="true"]{background:var(--surface2);color:var(--ink)}
.seg.sub button{font-weight:500;font-size:14px}
.pnav{display:flex;align-items:center;gap:10px;margin:10px 0 12px}
.pnav span{font-weight:700;font-size:17px}
.pnav button:not(.linkbtn){width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.pnav .linkbtn{margin-left:auto;font-size:13px}
.tadd{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.tadd input{flex:1 1 100%!important}
.tadd select{margin-left:auto}
.tadd input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2)}
.tadd select{flex:none;width:auto;padding:8px 6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px}
.tadd .primary{flex:none;padding:10px 14px}
.trow{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.trow .body{flex:1;min-width:0}.trow.done .content{text-decoration:line-through;color:var(--muted)}
.abadge{font-size:11px;border-radius:999px;padding:0 8px;border:1px solid}
.abadge.work{color:#FFD66B;border-color:rgba(255,214,107,.5)}.abadge.life{color:#FFB3D9;border-color:rgba(255,179,217,.5)}
.warn{color:#FFB86B}.muted{color:var(--muted)}
details summary{cursor:pointer;padding:8px 0}
.newtag{margin-left:6px;font-size:11px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px}
.orb.small{width:clamp(38px,5.5vw,50px);height:clamp(38px,5.5vw,50px)}
.pthumb{display:block;max-width:100%;max-height:260px;margin-top:12px;border-radius:10px;border:1px solid var(--line)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.photo{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--bg2)}
.photo figcaption{padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.photo figcaption span{color:var(--muted);font-size:12px}
.photo ul{margin:4px 0 0;padding-left:1.1em;color:var(--ink)}
.result{margin-top:16px;border-left:3px solid var(--cyan);padding:4px 0 4px 14px;border-radius:0}
.result h3,.rec-item h3{font-weight:700;font-size:18px;margin:0}
.result ul,.rec-item ul{margin:6px 0 0;padding-left:1.2em}
details{margin-top:8px;color:var(--muted);font-size:14px}
details p{white-space:pre-wrap;color:var(--ink);margin:6px 0 0}
.rec-item{padding:14px 0;border-bottom:1px solid var(--line)}
.meta{margin:4px 0 0;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 12px}
.vtext{display:block;width:100%;min-height:150px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);resize:vertical;line-height:1.7}
.composer textarea{display:block;width:100%;min-height:130px;border:0;background:transparent;resize:vertical;outline:none;line-height:1.7}
.composer textarea::placeholder{color:var(--muted)}
.prompts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 12px;font-size:13px;color:var(--muted)}
.chip:hover{color:var(--ink);border-color:var(--cyan)}
.actions{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.search{width:100%;margin:0 0 10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.list{list-style:none;margin:0;padding:0}
.item{padding:14px 0;border-bottom:1px solid var(--line);display:flex;gap:12px}
.item .body{flex:1;min-width:0}
.type{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.type::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}
.content{margin:2px 0 0;overflow-wrap:anywhere}
.quote{margin:4px 0 0;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.done .content{text-decoration:line-through;color:var(--muted)}
.check{width:20px;height:20px;margin-top:4px;accent-color:var(--cyan)}
.row-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.row-actions select,.row-actions button{font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2)}
.row-actions .del.armed{color:var(--red);border-color:var(--red)}
.empty{color:var(--muted);padding:20px 0}
h4{font-size:15px;margin:22px 0 6px;color:var(--muted);font-weight:500}
.core-summary{font-size:21px;line-height:1.6;margin:0;font-weight:500}
.core ul{margin:4px 0 0;padding-left:1.2em}
.copybox{width:100%;min-height:160px;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);padding:10px;font-size:13px}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;color:var(--muted);margin-top:20px}
.sr{position:absolute;left:-9999px}
.auth{max-width:440px;margin:24px auto 0}
.auth-tabs{display:flex;gap:4px;margin:0 0 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.auth-tabs button{flex:1;border:0;background:none;border-radius:9px;padding:8px;color:var(--muted);font-weight:700}
.auth-tabs button[aria-selected="true"]{background:var(--surface2);color:var(--ink)}
.field{display:block;margin:0 0 14px}
.field span{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
.field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2)}
.hint{font-size:13px;color:var(--muted);margin:-8px 0 12px}
.primary.wide{width:100%;padding:12px}
.copyrow{display:flex;gap:8px;align-items:center;margin:4px 0 14px}
.copyrow input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);font-size:13px}
@media (prefers-reduced-motion:reduce){.node{transition:none}}

<body>
<div class="wrap">
  <div class="brand">
    <img src="/favicon.svg" alt="" width="40" height="40">
    <h1 class="mark">knowkin</h1>
  </div>
  <p class="tagline">脳筋でも大丈夫。覚えるのは、こっちでやる。</p>

  <section id="login" class="auth" hidden>
    <div class="auth-tabs" role="tablist">
      <button type="button" role="tab" data-auth="login" aria-selected="true">ログイン</button>
      <button type="button" role="tab" data-auth="signup" aria-selected="false">アカウントを作る</button>
    </div>
    <div class="sheet">
      <label class="field" id="f-name" hidden><span>名前</span><input id="a-name" type="text" autocomplete="name"></label>
      <label class="field"><span>メールアドレス</span><input id="a-email" type="email" autocomplete="email" inputmode="email"></label>
      <label class="field"><span>パスワード</span><input id="a-pass" type="password" autocomplete="current-password"></label>
      <p class="hint" id="a-passhint" hidden>8文字以上</p>
      <label class="field" id="f-code" hidden><span>招待コード</span><input id="a-code" type="text" autocomplete="off"></label>
      <div class="actions" style="justify-content:stretch"><button class="primary wide" type="button" id="authBtn">ログイン</button></div>
      <p class="status err" id="authErr"></p>
      <p class="hint" id="authNote"></p>
    </div>
  </section>

  <main id="app" hidden>
    <div class="space">
      <div class="space-head"><h2 class="space-title">脳のネットワーク</h2><span class="space-date" id="today"></span></div>
      <div class="map" id="map" role="group" aria-label="記憶と5つの層のネットワーク。脳を押すと残せます。層を押すとその記憶を見られます"></div>
    </div>
    <div class="magnets" id="magnets"></div>
    <section class="panel" id="panel" aria-live="polite"></section>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
  <div id="actview" class="actview" hidden role="dialog" aria-modal="true" aria-label="行動"></div>
</div>

<script>
const TYPES={event:{label:'記憶',layer:'event'},input:{label:'インプット',layer:'know'},lesson:{label:'フィードバック・教訓',layer:'know'},idea:{label:'アイディア',layer:'think'},decision:{label:'判断と理由',layer:'think'},value:{label:'価値観',layer:'think'},question:{label:'未解決の問い',layer:'think'},task:{label:'タスク',layer:'act'},goal:{label:'目標',layer:'act'},person:{label:'人物',layer:'rel'}};
const LAYERS=[{id:'event',label:'出来事'},{id:'know',label:'知識'},{id:'think',label:'思考'},{id:'act',label:'行動'},{id:'rel',label:'関係'}];
// 自動で作られたカテゴリも含めて、種類と層を引く
const cats=()=>(state&&state.categories)||[];
function T(key){
  if(TYPES[key])return TYPES[key];
  const c=cats().find(x=>x.key===key);
  if(c)return {label:c.label,layer:c.layer==='new'?'n:'+c.layer_label:c.layer,custom:true};
  return {label:key||'記憶',layer:'event'};
}
function allLayers(){
  const extra=[...new Set(cats().filter(c=>c.layer==='new').map(c=>c.layer_label))].map(l=>({id:'n:'+l,label:l,custom:true}));
  return [...LAYERS,...extra];
}
const EXTRA_COL=['#FFB86B','#F5E663','#7CF0FF','#FF8F8F'];
function lcol(id){if(LCOL[id])return LCOL[id];const i=allLayers().filter(l=>l.custom).findIndex(l=>l.id===id);return EXTRA_COL[(i<0?0:i)%EXTRA_COL.length];}
function typeOptions(sel){
  return Object.entries(TYPES).map(([k,v])=>`<option value="${k}"${k===sel?' selected':''}>${v.label}</option>`).join('')
    +(cats().length?`<optgroup label="自動で作ったカテゴリ">${cats().map(c=>`<option value="${esc(c.key)}"${c.key===sel?' selected':''}>${esc(c.label)}</option>`).join('')}</optgroup>`:'');
}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={units:[],failed:[],core:null,recordings:[]};
const ui={view:'rec',layer:null,q:'',armed:null,result:null};
let busy=false;

function setStatus(t,err=false){const s=$('status');s.textContent=t;s.classList.toggle('err',err);}
async function api(path,opts={}){
  const headers={...(opts.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opts.headers||{})};
  const r=await fetch(path,{...opts,headers,credentials:'same-origin'});
  if(r.status===401&&!path.startsWith('/api/auth/')){showLogin('ログインが切れました。もう一度ログインしてください。');throw new Error('unauthorized');}
  const body=(r.headers.get('content-type')||'').includes('json')?await r.json():await r.text();
  if(!r.ok)throw new Error((body&&body.error)||'通信に失敗しました');
  return body;
}
let authMode='login',signup={open:true,needCode:false};
function setAuthMode(m){
  authMode=m;const s=m==='signup';
  document.querySelectorAll('[data-auth]').forEach(b=>b.setAttribute('aria-selected',b.dataset.auth===m));
  $('f-name').hidden=!s;$('a-passhint').hidden=!s;$('f-code').hidden=!(s&&signup.needCode);
  $('a-pass').autocomplete=s?'new-password':'current-password';
  $('authBtn').textContent=s?'アカウントを作ってはじめる':'ログイン';$('authBtn').disabled=s&&!signup.open;
  $('authNote').textContent=s?(signup.open?(signup.needCode?'アカウントを作るには招待コードが必要です。':'最初のアカウントです。これまでに残した記憶は、このアカウントに引き継がれます。'):'いまは新しいアカウントを作れません。'):'';
  $('authErr').textContent='';
}
function showLogin(msg=''){$('login').hidden=false;$('app').hidden=true;setAuthMode(authMode);$('authErr').textContent=msg;}
async function submitAuth(){
  const body={email:$('a-email').value,password:$('a-pass').value,name:$('a-name').value,code:$('a-code').value};
  if(!body.email||!body.password){$('authErr').textContent='メールアドレスとパスワードを入力してください。';return;}
  $('authBtn').disabled=true;
  try{await api('/api/auth/'+(authMode==='signup'?'signup':'login'),{method:'POST',body:JSON.stringify(body)});$('a-pass').value='';await load();}
  catch(e){$('authErr').textContent=e.message;}
  $('authBtn').disabled=false;
}
async function boot(){
  try{const s=await api('/api/auth/status');signup=s.signup||signup;
    if(s.user){
      const q=new URLSearchParams(location.search);const g=q.get('google');
      if(g){ui.view='account';history.replaceState(null,'','/');}
      await load();
      if(g==='connected')setStatus('Googleと連携しました。直近3日分から取り込みを始めます。');
      else if(g==='denied')setStatus('Googleとの連携をキャンセルしました。',true);
      else if(g==='error')setStatus('Googleとの連携に失敗しました：'+(q.get('msg')||''),true);
      return;}
    authMode=signup.open&&!signup.needCode?'signup':'login';showLogin();}
  catch(e){showLogin('サーバーに接続できませんでした。');}
}
async function load(){
  try{state=await api('/api/state');$('login').hidden=true;$('app').hidden=false;render();}
  catch(e){if(e.message!=='unauthorized'){$('app').hidden=false;$('login').hidden=true;render();setStatus('読み込みに失敗しました：'+e.message,true);}}
}

// ---- 目的 ----
const goalsAll=()=>(state&&state.goals)||[];
const goalCands=()=>goalsAll().filter(g=>g.status==='candidate');
function mapGoals(){return goalsAll().filter(g=>g.status==='active').slice().sort((a,b)=>(b.pinned-a.pinned)||String(a.due||'9999').localeCompare(String(b.due||'9999'))||(b.progress-a.progress)).slice(0,3);}
const gcol=g=>GCOL[g.area]||GCOL.work;
const areaLabel=a=>a==='life'?'プライベート':'仕事';
function gpathHTML(g){
  const n=g.milestones.length;
  const ms=n?g.milestones.slice(0,-1).map((m,i)=>`<span class="ms${m.done?' done':''}" style="left:${(((i+1)/n)*92).toFixed(1)}%"></span>`).join(''):'';
  const p=Math.min(92,g.progress*0.92);
  return `<div class="gpath" style="--gc:${gcol(g)}"><span class="base"></span><span class="fill" style="width:${p.toFixed(1)}%"></span>${ms}<span class="here" style="left:${p.toFixed(1)}%"></span><span class="flag" aria-hidden="true">⚑</span></div>`;
}
function goalCardHTML(g){
  const d=g.milestones.filter(m=>m.done).length;
  const right=g.stalled?`<span style="color:#FFB86B">${g.idle_days}日動きなし</span>`:g.status==='paused'?'保留中':g.due?`${esc(g.due)}まで`:'期限なし';
  return `<button type="button" class="gcard" data-goal="${g.id}" style="--gc:${gcol(g)}">
    <span class="gtop"><span class="gbadge">${areaLabel(g.area)}</span><span>${g.pinned?'📌 ':''}${right}</span></span>
    <p class="gtitle">${esc(g.title)}</p>${g.future?`<p class="gfuture">${esc(g.future)}</p>`:''}
    ${gpathHTML(g)}
    <p class="gnow"><b>今ここ</b>　${g.milestones.length?`道のり ${d}/${g.milestones.length}・`:''}タスク ${g.tasks_done}/${g.tasks_total}　<span style="color:var(--muted)">${esc(g.note||'')}</span></p></button>`;
}
function candHTML(g){
  return `<li class="item"><div class="body"><div class="type" style="color:${gcol(g)}">目的の候補・${areaLabel(g.area)}</div><p class="content"><strong>${esc(g.title)}</strong></p>
    ${g.future?`<p class="quote">${esc(g.future)}</p>`:''}${g.milestones.length?`<p class="quote">道のり：${g.milestones.map(m=>esc(m.title)).join(' → ')}</p>`:''}
    <div class="row-actions"><button data-gapprove="${g.id}">目的にする</button><button class="del${ui.armed==='gr'+g.id?' armed':''}" data-greject="${g.id}">${ui.armed==='gr'+g.id?'もう一度押すと見送ります':'見送る'}</button></div></div></li>`;
}
function renderGoals(p){
  const c=goalCands();const act=goalsAll().filter(g=>g.status==='active');const paused=goalsAll().filter(g=>g.status==='paused');
  let html=`<h2>目的</h2><p class="lead">仕事でもプライベートでも、成し遂げたいこと・叶えたい未来です。話したことや記録からClaudeが候補を出し、あなたが承認すると目的になります。</p>`;
  if(c.length)html+=`<h4>承認待ちの候補</h4><ul class="list">${c.map(candHTML).join('')}</ul>`;
  html+=act.length?`<h4>進行中</h4>${act.map(goalCardHTML).join('')}`:`<p class="empty">進行中の目的はまだありません。やりたいことや叶えたいことを記録に残すと、Claudeが整理のときに候補を出します。</p>`;
  if(paused.length)html+=`<h4>保留中</h4>${paused.map(goalCardHTML).join('')}`;
  p.innerHTML=html;
}
function renderGoal(p){
  const g=goalsAll().find(x=>x.id===ui.goal);if(!g){ui.view='goals';return renderGoals(p);}
  const linked=state.units.filter(u=>u.goal_id===g.id);const tasks=linked.filter(u=>u.type==='task'||u.type==='goal');const others=linked.filter(u=>!(u.type==='task'||u.type==='goal'));
  const arm=k=>ui.armed===k;
  p.innerHTML=`<button class="back" type="button" data-view="goals">← 目的一覧</button>
  <div style="--gc:${gcol(g)}">
    <span class="gbadge">${areaLabel(g.area)}</span>${g.status==='paused'?'<span class="newtag">保留中</span>':''}
    <h2 style="margin-top:8px">${esc(g.title)}</h2>
    <div class="future-box">
      ${g.future?`<p class="lbl" style="margin-top:0">叶えたい未来</p><p style="font-size:17px">${esc(g.future)}</p>`:''}
      ${g.why?`<p class="lbl">なぜ</p><p>${esc(g.why)}</p>`:''}
      ${g.criteria?`<p class="lbl">達成の基準</p><p>${esc(g.criteria)}</p>`:''}
      ${g.due?`<p class="lbl">期限</p><p>${esc(g.due)}</p>`:''}
    </div>
    ${gpathHTML(g)}
    <div class="sheet" style="margin-top:14px"><p class="hint" style="margin:0 0 6px">現在地${g.note_at?`（Claudeの見立て・${esc(new Date(g.note_at).toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo'}))}）`:''}</p>
      <p style="margin:0">${g.note?esc(g.note):`進み具合 ${g.progress}%。Claudeが整理するときに、つながった記憶から現在地を書きます。`}</p>${g.stalled?`<p class="status err" style="margin:6px 0 0">${g.idle_days}日動きがありません</p>`:''}</div>
    <h4>道のり</h4>
    ${g.milestones.length?`<ul class="msl">${g.milestones.map(m=>`<li class="${m.done?'done':''}"><input type="checkbox" class="check" data-ms="${g.id}|${m.id}" ${m.done?'checked':''} aria-label="済みにする"><span>${esc(m.title)}</span>${m.now?'<span class="nowtag">今ここ</span>':''}</li>`).join('')}</ul>`:'<p class="empty" style="padding:8px 0">道のりはまだありません。</p>'}
    <div class="copyrow" style="margin-top:10px"><input id="ms-new" type="text" placeholder="道のりを足す（例：月150件を達成する）" aria-label="道のりを足す"><button class="ghost" data-msadd="${g.id}">追加</button></div>
    <h4>つながっているタスク</h4>

const net={raf:0,ctx:null,w:0,h:0,parts:[],stars:[],centers:{},core:null};
const still=matchMedia('(prefers-reduced-motion: reduce)');
const hash=(s,k)=>{let x=2166136261^k;for(const ch of String(s)){x^=ch.charCodeAt(0);x=Math.imul(x,16777619);}return ((x>>>0)%10000)/10000;};
function layoutNet(){
  const map=$('map');if(!map)return;const canvas=map.querySelector('canvas');if(!canvas)return;
  cancelAnimationFrame(net.raf);
  const box=map.getBoundingClientRect();const dpr=Math.min(window.devicePixelRatio||1,2);
  net.w=box.width;net.h=box.height;canvas.width=net.w*dpr;canvas.height=net.h*dpr;
  net.ctx=canvas.getContext('2d');net.ctx.setTransform(dpr,0,0,dpr,0,0);
  const center=el=>{const r=el.getBoundingClientRect();const orb=el.querySelector('.orb,.brain')||el;const o=orb.getBoundingClientRect();return{x:o.left+o.width/2-box.left,y:o.top+o.height/2-box.top,rw:r.width};};
  const coreEl=map.querySelector('.node.core');net.core=center(coreEl);
  net.centers={};map.querySelectorAll('.node[data-node]').forEach(el=>{net.centers[el.dataset.node]=center(el);});
  // 脳から各層への光るリンク
  const c=net.core;
  $('linkPaths').innerHTML=Object.entries(net.centers).map(([id,p],i)=>{const mx=(c.x+p.x)/2+(i%2?18:-18),my=(c.y+p.y)/2+(i%2?-12:12);
    const d=`M${c.x.toFixed(1)} ${c.y.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`;return `<path d="${d}"/><path class="flow" d="${d}"/>`;}).join('');
  map.querySelector('svg.links').setAttribute('viewBox',`0 0 ${net.w} ${net.h}`);
  const gs=mapGoals();
  $('linkPaths').insertAdjacentHTML('beforeend',[...map.querySelectorAll('.goal')].map((el,i)=>{const g=gs[i];if(!g)return '';const col=GCOL[g.area]||GCOL.work;
    const r=el.querySelector('.star').getBoundingClientRect();const x=r.left+r.width/2-box.left,y=r.top+r.height/2-box.top;
    const f=Math.max(0.04,g.progress/100);const px=c.x+(x-c.x)*f,py=c.y+(y-c.y)*f;
    return `<path d="M${c.x.toFixed(1)} ${c.y.toFixed(1)} L${x.toFixed(1)} ${y.toFixed(1)}" style="stroke:${col};stroke-width:1.2;stroke-dasharray:2 7;opacity:.55;filter:none"/><circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="4.5" fill="#fff" style="filter:drop-shadow(0 0 5px ${col}) drop-shadow(0 0 10px ${col})"/>`;}).join(''));
  // 背景の粒子
  const n=Math.min(110,Math.round(net.w*net.h/7000));
  if(net.parts.length!==n)net.parts=Array.from({length:n},()=>({x:Math.random()*net.w,y:Math.random()*net.h,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.4+.4}));
  // 記憶の星：各層のまわりに1件1つ
  const scale=Math.min(net.w,net.h);
  net.stars=[];const per={};
  for(const u of state.units||[]){if(isPeri(u))continue;const l=layerOf(u);per[l]=(per[l]||0)+1;if(per[l]>45)continue;
    net.stars.push({layer:l,a:hash(u.id,1)*Math.PI*2,rad:scale*(.07+hash(u.id,2)*.09),size:1.6+(u.importance||2)*.6+Math.min(u.count||1,4)*.4,spd:(hash(u.id,3)-.5)*.004,done:u.done});}
  if(still.matches)drawNet();else loopNet();
}
function drawNet(){
  const g=net.ctx;if(!g)return;const{w,h,parts,stars,centers}=net;g.clearRect(0,0,w,h);
  for(let i=0;i<parts.length;i++){const a=parts[i];for(let j=i+1;j<parts.length;j++){const b=parts[j];const dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;
    if(d<110*110){g.strokeStyle=`rgba(120,160,255,${(1-Math.sqrt(d)/110)*.28})`;g.lineWidth=.6;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();}}}
  for(const p of parts){g.fillStyle='rgba(190,215,255,.75)';g.beginPath();g.arc(p.x,p.y,p.r,0,Math.PI*2);g.fill();}
  for(const s of stars){const c=centers[s.layer];if(!c)continue;const x=c.x+Math.cos(s.a)*s.rad,y=c.y+Math.sin(s.a)*s.rad*.8;
    g.strokeStyle=lcol(s.layer)+'55';g.lineWidth=.8;g.beginPath();g.moveTo(c.x,c.y);g.lineTo(x,y);g.stroke();
    g.shadowColor=lcol(s.layer);g.shadowBlur=10;g.fillStyle=s.done?'rgba(200,210,235,.5)':lcol(s.layer);g.beginPath();g.arc(x,y,s.size,0,Math.PI*2);g.fill();g.shadowBlur=0;}
}
function loopNet(){
  for(const p of net.parts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>net.w)p.vx*=-1;if(p.y<0||p.y>net.h)p.vy*=-1;}
  for(const s of net.stars)s.a+=s.spd;

document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(net.raf);else if(!still.matches){cancelAnimationFrame(net.raf);loopNet();}});
window.addEventListener('resize',()=>{clearTimeout(net.t);net.t=setTimeout(layoutNet,120);});

function photoHTML(){

}
let pickedPhoto=null;
function bindPhoto(){
  const d=$('pdrop');if(!d)return;
  ['dragenter','dragover'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove('over');}));
  d.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)pickPhoto(f);});
  $('pfile').addEventListener('change',e=>{const f=e.target.files[0];if(f)pickPhoto(f);e.target.value='';});
}
function pickPhoto(f){
  if(!/^image\//.test(f.type)&&!/\.(heic|heif)$/i.test(f.name)){setStatus('写真のファイルを選んでください。',true);return;}
  if(f.size>25*1024*1024){setStatus('写真が大きすぎます（25MBまで）。',true);return;}
  pickedPhoto=f;const url=URL.createObjectURL(f);
  $('ppreview').innerHTML=`<img class="pthumb" src="${url}" alt="選んだ写真"><p class="hint" style="margin:6px 0 0">${esc(f.name)}（${(f.size/1024/1024).toFixed(1)}MB）</p>`;
  $('psave').disabled=false;setStatus('');
}
function sendPhoto(){
  if(busy||!pickedPhoto)return;busy=true;$('psave').disabled=true;
  const fd=new FormData();fd.append('file',pickedPhoto,pickedPhoto.name||'photo.jpg');fd.append('caption',$('pcaption').value);
  $('pprog').innerHTML=`<div class="prog"><div class="prog-bar"><span id="pfill"></span></div><div class="prog-row"><span id="plabel">送信中 0%</span></div></div>`;
  const x=new XMLHttpRequest();x.open('POST','/api/photos');
  x.upload.onprogress=e=>{if(e.lengthComputable){const p=e.loaded/e.total;$('pfill').style.width=(p*90).toFixed(0)+'%';$('plabel').textContent=p<1?`送信中 ${Math.round(p*100)}%`:'保存しています';}};
  x.onload=async()=>{busy=false;
    if(x.status===401){showLogin('ログインが切れました。もう一度ログインしてください。');return;}
    if(x.status>=400){let m='写真を保存できませんでした';try{m=JSON.parse(x.responseText).error||m;}catch(_){}setStatus(m,true);$('pprog').innerHTML='';$('psave').disabled=false;return;}
    pickedPhoto=null;setStatus('写真を残しました。Claudeとの会話で「knowkinの未整理メモを整理して」と頼むと、写っている内容を読み取って分類します。');await load();};
  x.onerror=()=>{busy=false;setStatus('通信が切れました。電波のよい場所でもう一度お試しください。',true);$('pprog').innerHTML='';$('psave').disabled=false;};
  x.send(fd);
}

async function toggleRecord(){

    recorder=new MediaRecorder(stream,type?{mimeType:type}:undefined);chunks=[];
    recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};

      const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});

// ---- アップロードの進み具合 ----
const STAGES=[{id:'upload',label:'送信'},{id:'convert',label:'変換'},{id:'ai',label:'文字起こし・要約'},{id:'save',label:'振り分け'}];
let prog=null;
function progressHTML(name,size){
  return `<div class="prog" id="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="アップロードの進み具合">
    <div class="prog-file"><span>${esc(name)}</span><span>${(size/1024/1024).toFixed(1)}MB</span></div>
    <div class="prog-bar"><span id="prog-fill"></span></div>
    <div class="prog-row"><span id="prog-label">アップロード中 0%</span><span id="prog-time"></span></div>
    <ol class="prog-steps">${STAGES.map(s=>`<li data-step="${s.id}">${s.label}</li>`).join('')}</ol></div>`;
}
function setProg(pct,label){
  if(!prog)return;prog.pct=Math.max(prog.pct,Math.min(100,pct));
  const f=$('prog-fill'),l=$('prog-label'),bar=$('prog');
  if(f)f.style.width=prog.pct.toFixed(1)+'%';if(bar)bar.setAttribute('aria-valuenow',Math.round(prog.pct));if(l&&label)l.textContent=label;
}
function setStep(id){
  if(!prog)return;prog.stage=id;prog.stageAt=Date.now();const idx=STAGES.findIndex(s=>s.id===id);
  document.querySelectorAll('.prog-steps li').forEach((li,i)=>{li.className=i<idx?'done':i===idx?'now':'';});
}
function tickProg(){
  if(!prog)return;const s=Math.floor((Date.now()-prog.start)/1000);const t=$('prog-time');if(t)t.textContent=`経過 ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  if(prog.stage==='ai'){const est=prog.est||30;const e=(Date.now()-prog.stageAt)/1000;
    setProg(42+48*(1-Math.exp(-e/est)),`文字起こしと要約をしています（目安 ${est<60?'1分以内':Math.round(est/60)+'分ほど'}）`);}
}
function uploadVoice(fd,onUp,onLine){
  return new Promise((resolve,reject)=>{
    const x=new XMLHttpRequest();x.open('POST','/api/voice');x.setRequestHeader('Accept','application/x-ndjson');
    let seen=0,buf='';
    const read=()=>{buf+=x.responseText.slice(seen);seen=x.responseText.length;let i;
      while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i);buf=buf.slice(i+1);if(line.trim()){try{onLine(JSON.parse(line));}catch(_){}}}};
    x.upload.onprogress=e=>{if(e.lengthComputable)onUp(e.loaded/e.total);};
    x.upload.onload=()=>onUp(1);
    x.onprogress=read;
    x.onload=()=>{
      if(x.status===401){showLogin('ログインが切れました。もう一度ログインしてください。');return reject(new Error('unauthorized'));}
      if(x.status>=400){let m='アップロードに失敗しました';try{m=JSON.parse(x.responseText).error||m;}catch(_){}return reject(new Error(m));}
      read();resolve();
    };
    x.onerror=()=>reject(new Error('通信が切れました。電波のよい場所でもう一度お試しください。'));
    x.send(fd);
  });
}
async function sendAudio(blob,name){
  if(busy)return;
  if(blob.size>100*1024*1024){setStatus('ファイルが大きすぎます（100MBまで）。',true);return;}
  busy=true;const t=$('timer');if(t)t.textContent='';setStatus('');
  document.querySelectorAll('#recbtn,#pick').forEach(b=>b.disabled=true);
  ui.result=null;const box=$('result');if(box)box.innerHTML=progressHTML(name,blob.size);
  prog={pct:0,start:Date.now(),stage:'upload',stageAt:Date.now(),est:30,timer:null};setStep('upload');
  prog.timer=setInterval(tickProg,300);
  let result=null,failure=null;
  try{
    const fd=new FormData();fd.append('file',blob,name);
    await uploadVoice(fd,
      p=>{if(prog.stage==='upload')setProg(p*30,p<1?`アップロード中 ${Math.round(p*100)}%`:'アップロードが終わりました');},
      m=>{
        if(m.stage==='received'){setProg(32,'サーバーで受け取りました');}
        else if(m.stage==='convert'){setStep('convert');setProg(35,'音声を変換しています');}
        else if(m.stage==='ai'){setStep('ai');prog.est=Math.max(15,15+(m.minutes||1)*6);setProg(42,'文字起こしと要約をしています');}
        else if(m.stage==='save'){setStep('save');setProg(93,'記憶に振り分けています');}
        else if(m.stage==='done'){result=m.result;}
        else if(m.stage==='error'){failure=m.error;}
      });
    if(failure)throw new Error(failure);
    if(!result)throw new Error('処理の結果を受け取れませんでした。「最近の録音」に入っていないか確認してください。');
    setStep('done');setProg(100,'完了しました');
    document.querySelectorAll('.prog-steps li').forEach(li=>li.className='done');
    ui.result=result;clearInterval(prog.timer);prog=null;
    setStatus('記憶に残しました。');await load();
  }catch(e){
    if(prog){clearInterval(prog.timer);prog=null;}
    if(e.message!=='unauthorized'){setStatus(e.message,true);render();}
  }
  busy=false;
}

function drawersFor(layerId){

const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const fromYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
function isoWeekOf(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return {wy:t.getUTCFullYear(),w:Math.ceil(((t-y0)/86400000+1)/7)};}
function periodKey(scope,d){if(scope==='year')return String(d.getFullYear());if(scope==='month')return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;if(scope==='week'){const {wy,w}=isoWeekOf(d);return `${wy}-W${pad2(w)}`;}return ymd(d);}
function weekStart(wy,w){const jan4=new Date(wy,0,4);const day=jan4.getDay()||7;const mon=new Date(wy,0,4-day+1);mon.setDate(mon.getDate()+(w-1)*7);return mon;}
function rangeOf(scope,key){ // [開始, 終了] の日付文字列
  if(scope==='year')return [`${key}-01-01`,`${key}-12-31`];
  if(scope==='month'){const [y,m]=key.split('-').map(Number);return [`${key}-01`,ymd(new Date(y,m,0))];}
  if(scope==='week'){const [y,w]=key.split('-W').map(Number);const s=weekStart(y,w);const e=new Date(s);e.setDate(s.getDate()+6);return [ymd(s),ymd(e)];}
  return [key,key];
}
function shiftDate(scope,d,n){const x=new Date(d);if(scope==='year')x.setFullYear(x.getFullYear()+n);else if(scope==='month'){x.setDate(1);x.setMonth(x.getMonth()+n);}else if(scope==='week')x.setDate(x.getDate()+7*n);else x.setDate(x.getDate()+n);return x;}
function periodTitle(scope,d){
  const key=periodKey(scope,d);const today=new Date();const cur=key===periodKey(scope,today);
  const pre={day:'今日',week:'今週',month:'今月',year:'今年'}[scope];
  if(scope==='day')return (cur?'今日 ':'')+`${d.getMonth()+1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`;
  if(scope==='week'){const [s,e]=rangeOf('week',key).map(fromYmd);return (cur?'今週 ':'')+`${s.getMonth()+1}/${s.getDate()}〜${e.getMonth()+1}/${e.getDate()}`;}
  if(scope==='month')return (cur?'今月 ':'')+`${d.getFullYear()}年${d.getMonth()+1}月`;
  return (cur?'今年 ':'')+`${d.getFullYear()}年`;
}

function renderTasks(p,{embedded=false}={}){
  const sc=ui.tscope||'day';const d=ui.tdate||new Date();const key=periodKey(sc,d);const [vs,ve]=rangeOf(sc,key);
  const af=ui.tarea||'all';const isCur=key===periodKey(sc,new Date());
  const gsel=ui.tgoal&&goalsAll().find(g=>g.id===ui.tgoal);if(!gsel)ui.tgoal=null;
  const tasks=state.units.filter(isTask).filter(u=>af==='all'||areaOf(u)===af).filter(u=>!ui.tgoal||u.goal_id===ui.tgoal);
  const inView=[],carry=[],someday=[];
  for(const u of tasks){const r=effRange(u);
    if(!r){if(!u.done)someday.push(u);continue;}
    if(r[0]>=vs&&r[0]<=ve)inView.push(u); // 期間をまたぐ週は、はじまりの日の月・年に入れる
    else if(isCur&&!u.done&&r[1]<vs)carry.push(u);}
  const byDue=(a,b)=>String(a.due||'9999').localeCompare(String(b.due||'9999'));
  const open=inView.filter(u=>!u.done).sort(byDue),done=inView.filter(u=>u.done);
  const n=a=>state.units.filter(isTask).filter(u=>{if(u.done||areaOf(u)!==a)return false;const r=effRange(u);return r&&r[0]>=vs&&r[0]<=ve;}).length;
  const tot=open.length+done.length;const pct=tot?Math.round(done.length/tot*100):0;
  p.innerHTML=`${embedded?'':`<h2>行動</h2><p class="lead">タスクを、年・月・週・日と、仕事・プライベートで分けて管理します。</p>`}
  <div class="seg" role="tablist" aria-label="期間">${['day','week','month','year'].map(s=>`<button role="tab" data-tscope="${s}" aria-selected="${sc===s}">${SCOPE_LBL[s]}</button>`).join('')}</div>
  <div class="seg sub" role="tablist" aria-label="分野"><button role="tab" data-tarea="all" aria-selected="${af==='all'}">すべて</button><button role="tab" data-tarea="work" aria-selected="${af==='work'}">仕事 ${n('work')}</button><button role="tab" data-tarea="life" aria-selected="${af==='life'}">プライベート ${n('life')}</button></div>
  ${gsel?`<div class="gfilter">★ ${esc(gsel.title)} のタスクだけ<button type="button" class="linkbtn" data-tgoal="${gsel.id}">解除</button></div>`:''}
  <div class="pnav"><button type="button" data-tshift="-1" aria-label="前へ">‹</button><span>${periodTitle(sc,d)}</span><button type="button" data-tshift="1" aria-label="次へ">›</button>${isCur?'':'<button type="button" class="linkbtn" data-tshift="0">今に戻る</button>'}${tot?`<em class="pcount">${done.length} / ${tot} 完了</em>`:''}</div>
  ${tot?`<div class="tbar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="この期間の完了"><span style="width:${pct}%"></span></div>`:''}
  <div class="tadd"><input id="t-new" type="text" placeholder="${{day:'今日',week:'この週',month:'この月',year:'この年'}[sc]}にやることを足す" aria-label="タスクを足す"><select id="t-area" aria-label="分野"><option value="work"${af==='life'?'':' selected'}>仕事</option><option value="life"${af==='life'?' selected':''}>プライベート</option></select><button class="primary" type="button" id="t-add">追加</button></div>
  ${carry.length?`<h4>持ち越し <span class="warn">${carry.length}</span></h4><ul class="list">${carry.sort(byDue).map(taskRowHTML).join('')}</ul>`:''}
  <h4>${periodTitle(sc,d)}のタスク <span class="muted">${open.length}</span></h4>
  ${open.length?`<ul class="list">${open.map(taskRowHTML).join('')}</ul>`:`<p class="empty" style="padding:10px 0">この期間のタスクはありません。</p>`}
  ${done.length?`<details><summary>終わったもの ${done.length}件</summary><ul class="list">${done.map(taskRowHTML).join('')}</ul></details>`:''}
  ${someday.length?`<details${isCur&&sc==='year'?' open':''}><summary>いつか（時期が決まっていない） ${someday.length}件</summary><ul class="list">${someday.map(taskRowHTML).join('')}</ul></details>`:''}`;
  $('t-new').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)addTaskUI();});
}
async function addTaskUI(){
  const v=$('t-new').value.trim();if(!v){setStatus('タスクの内容を入れてください。',true);return;}
  const sc=ui.tscope||'day';const d=ui.tdate||new Date();
  await api('/api/tasks',{method:'POST',body:JSON.stringify({content:v,area:$('t-area').value,scope:sc,period:periodKey(sc,d),goal_id:ui.tgoal||null})});
  setStatus(ui.tgoal?'タスクを足して、目的につなぎました。':'タスクを足しました。');await load();
}

function openAct(from){
  const v=$('actview');if(ui.actOpen){renderActView();return;}
  ui.actOpen=true;renderActView();
  const r=from&&from.getBoundingClientRect();const x=r?r.left+r.width/2:innerWidth/2,y=r?r.top+r.height/2:innerHeight/2;
  v.style.setProperty('--ox',x+'px');v.style.setProperty('--oy',y+'px');
  v.hidden=false;document.body.classList.add('lock');requestAnimationFrame(()=>v.classList.add('open'));v.scrollTop=0;
  try{history.pushState({act:1},'');}catch(_){}
}
function closeAct(fromPop){
  const v=$('actview');if(!ui.actOpen)return;ui.actOpen=false;v.classList.remove('open');document.body.classList.remove('lock');
  setTimeout(()=>{if(!ui.actOpen)v.hidden=true;},still.matches?0:320);
  if(!fromPop){try{if(history.state&&history.state.act)history.back();}catch(_){}}
  render();
}
window.addEventListener('popstate',()=>{if(ui.actOpen)closeAct(true);});

function spark(vals,col){
  const w=140,hgt=36,pts=vals.map((v,i)=>v==null?null:[i*(w/(vals.length-1)),v]);const nums=vals.filter(v=>v!=null);
  if(nums.length<1)return `<svg class="spark" viewBox="0 0 ${w} ${hgt}" aria-hidden="true"></svg>`;
  const mx=Math.max(...nums),mn=Math.min(0,...nums);const y=v=>hgt-4-((v-mn)/((mx-mn)||1))*(hgt-8);
  const d=pts.filter(Boolean).map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${y(p[1]).toFixed(1)}`).join(' ');
  const last=pts.filter(Boolean).pop();
  return `<svg class="spark" viewBox="0 0 ${w} ${hgt}" aria-hidden="true"><path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${y(last[1])}" r="3" fill="${col}"/></svg>`;
}
async function renderGrowth(p){
  if(!ui.growth){p.innerHTML=`<h2>脳の成長</h2><p class="lead">読み込んでいます…</p>`;
    try{ui.growth=await api('/api/growth');}catch(e){if(e.message!=='unauthorized')p.innerHTML=`<h2>脳の成長</h2><p class="status err">${esc(e.message)}</p>`;return;}
    if(ui.view!=='growth')return;}
  const g=ui.growth;const r=g.repro;const L=allLayers();const maxL=Math.max(1,...L.map(l=>g.layers[l.id]||0));
  const wk=g.weeks.map(w=>w.total);const grew=wk.length>1?wk[wk.length-1]-wk[0]:0;
  const pend=ui.quizPending;
  p.innerHTML=`<h2>脳の成長</h2><p class="lead">knowkinがどれだけあなたの脳に近づいているかを、量・深さ・広さ・再現度の4つで見ます。</p>
  <div class="gr-hero"><div><p class="gr-lbl">今月の再現度</p><p class="gr-big">${r.month==null?'—':r.month+'<small>%</small>'}</p>
    <p class="gr-sub">${r.month==null?'今月はまだテストに答えていません':`${r.month_count}問に答えた結果`}${r.all!=null?`　これまで全体 ${r.all}%（${r.all_count}問）`:''}</p></div>${spark(r.weeks,'#6FCF97')}</div>

  <h4>再現度テスト</h4>
  ${g.quiz_open.length?g.quiz_open.map(q=>`<div class="quiz"><p class="q">Q. ${esc(q.question)}</p><p class="pred"><span>Claudeの予想</span>${esc(q.prediction)}</p>${q.basis?`<p class="basis">根拠：${esc(q.basis)}</p>`:''}
    ${pend&&pend.id===q.id?`<label class="field" style="margin:10px 0 8px"><span>${pend.rating==='miss'?'本当はどう考えますか？':'補足があれば（任意）'}</span><textarea id="qfix" class="vtext" style="min-height:80px"></textarea></label><div class="actions" style="justify-content:flex-start"><button class="primary" data-qsend="${q.id}">送る</button><button class="ghost" data-qcancel>やめる</button></div>`
    :`<div class="qbtns"><button data-qrate="${q.id}|great">◎ そのとおり</button><button data-qrate="${q.id}|ok">○ だいたい</button><button data-qrate="${q.id}|miss">△ 違う</button></div>`}</div>`).join('')
    :`<p class="hint" style="margin:0 0 10px">今答えられるテストはありません。週に1回、整理のときにClaudeが3問作ります。</p><div class="actions" style="justify-content:flex-start"><button class="ghost" id="qreq">今週のテストを作ってもらう</button></div>`}

  <div class="gr-grid">
    <div class="gr-card"><p class="gr-lbl">量</p><p class="gr-num">${g.total}<small>件</small></p><p class="gr-sub">この1週間 +${g.last7}　8週間で +${grew}</p>${spark(wk,'#5CD2FF')}</div>
    <div class="gr-card"><p class="gr-lbl">深さ</p><p class="gr-num">${g.depth.rooted}<small>個</small></p><p class="gr-sub">定着した考え（2回以上出てきた教訓・価値観・判断）</p><p class="gr-sub">理由つきの判断 ${g.depth.decisions_with_reason} / ${g.depth.decisions}</p></div>
    <div class="gr-card"><p class="gr-lbl">広さ</p><p class="gr-num">${g.breadth.people}<small>人</small></p><p class="gr-sub">関わる人　引き出し ${g.breadth.genres}個</p><p class="gr-sub">タスク 仕事 ${g.breadth.work}・プライベート ${g.breadth.life}</p></div>
    <div class="gr-card"><p class="gr-lbl">層のバランス</p>${L.map(l=>`<div class="lbar"><span class="lbar-n">${esc(l.label)}</span><span class="lbar-t"><span style="width:${((g.layers[l.id]||0)/maxL*100).toFixed(0)}%;background:${lcol(l.id)}"></span></span><span class="lbar-c">${g.layers[l.id]||0}</span></div>`).join('')}</div>
  </div>
  ${g.hints.length?`<h4>次に伸ばすには</h4><ul class="gr-hints">${g.hints.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
  ${g.quiz_recent.length?`<details><summary>最近のテストの結果</summary><ul class="list">${g.quiz_recent.map(q=>`<li class="item"><div class="body"><div class="type" style="color:${q.rating==='great'?'#6FCF97':q.rating==='ok'?'#DDB262':'#FF7A9A'}">${q.rating==='great'?'◎ そのとおり':q.rating==='ok'?'○ だいたい':'△ 違う'}</div><p class="content">${esc(q.question)}</p><p class="quote">予想：${esc(q.prediction)}</p>${q.correction?`<p class="quote">あなたの答え：${esc(q.correction)}</p>`:''}</div></li>`).join('')}</ul></details>`:''}`;
}
const PANELS={rec:renderRec,layer:renderLayer,review:renderReview,core:renderCore,account:renderAccount,goals:renderGoals,goal:renderGoal,growth:renderGrowth};
function render(){renderMap();(PANELS[ui.view]||renderRec)($('panel'));if(ui.actOpen)renderActView();}

// ---- 操作 ----
const patch=(id,body)=>api('/api/units/'+id,{method:'PATCH',body:JSON.stringify(body)});
const localUnit=id=>state.units.find(u=>u.id===Number(id));
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,input[type=checkbox]');if(!t)return;
  try{
    if(t.dataset.auth){setAuthMode(t.dataset.auth);return;}
    if(t.id==='authBtn'){submitAuth();return;}
    if(t.id==='logout'){await api('/api/auth/logout',{method:'POST'});state={units:[],failed:[],core:null,recordings:[]};ui.view='rec';authMode='login';showLogin();return;}
    if(t.id==='rotate'){if(ui.armed!=='rotate'){ui.armed='rotate';t.textContent='もう一度押すと作り直します（今のURLは使えなくなります）';t.classList.add('on');return;}
      ui.armed=null;await api('/api/account/rotate',{method:'POST'});ui.account=null;setStatus('連携キーを作り直しました。Claude.aiのコネクタURLも新しいものに変えてください。');render();return;}
    if(t.id==='disconnect'){if(ui.armed!=='disconnect'){ui.armed='disconnect';t.textContent='もう一度押すと切ります（Claude.aiで接続し直しが必要になります）';t.classList.add('on');return;}
      ui.armed=null;await api('/api/account/disconnect',{method:'POST'});setStatus('Claude.aiとの接続を切りました。');render();return;}
    if(t.dataset.copy){const i=$(t.dataset.copy);i.select();try{await navigator.clipboard.writeText(i.value);t.textContent='コピーしました';setTimeout(()=>{t.textContent='コピー';},1500);}catch(_){}return;}
    if(t.id==='pwBtn'){try{await api('/api/account/password',{method:'POST',body:JSON.stringify({current:$('pw-cur').value,next:$('pw-new').value})});authMode='login';showLogin('パスワードを変えました。新しいパスワードでログインしてください。');}catch(err){setStatus(err.message,true);}return;}
    if(t.dataset.goal){if((recorder&&recorder.state==='recording')||live||prog){setStatus('録音・アップロードの処理中です。',true);return;}ui.view='goal';ui.goal=Number(t.dataset.goal);ui.armed=null;setStatus('');render();$('panel').scrollIntoView({behavior:'smooth',block:'start'});return;}
    if(t.dataset.rel){const [id,v]=t.dataset.rel.split('|');const u=localUnit(id);u.relevance=v;render();await patch(u.id,{relevance:v});setStatus(v==='peripheral'?'周辺の情報に移しました。':'自分に関係ある記憶に戻しました。');return;}
    if(t.dataset.qrate){const [id,rt]=t.dataset.qrate.split('|');if(rt==='great'){await api(`/api/quiz/${id}/rate`,{method:'POST',body:JSON.stringify({rating:rt})});ui.growth=null;setStatus('採点しました。');render();return;}ui.quizPending={id:Number(id),rating:rt};render();$('qfix').focus();return;}
    if(t.dataset.qcancel!==undefined){ui.quizPending=null;render();return;}
    if(t.dataset.qsend){const pnd=ui.quizPending;const fix=$('qfix').value.trim();if(pnd.rating==='miss'&&!fix){setStatus('本当の考えを一言書いてください。それがknowkinの新しい記憶になります。',true);return;}
      await api(`/api/quiz/${t.dataset.qsend}/rate`,{method:'POST',body:JSON.stringify({rating:pnd.rating,correction:fix})});ui.quizPending=null;ui.growth=null;setStatus(fix?'採点しました。あなたの答えは新しい記録として残し、次の整理で記憶になります。':'採点しました。');render();return;}
    if(t.id==='qreq'){await api('/api/quiz/request',{method:'POST'});setStatus('依頼しました。次の整理のときにClaudeがテストを作ります。すぐ作るなら会話で「knowkinの再現度テストを作って」と頼んでください。');return;}
    if(t.dataset.greqtasks){await api(`/api/goals/${t.dataset.greqtasks}/request-tasks`,{method:'POST'});setStatus('依頼しました。次の整理のときにClaudeがタスクを作ります。すぐ作るなら会話で「knowkinの目的からタスクを作って」と頼んでください。');await load();return;}
    if(t.dataset.gapprove){await api('/api/goals/'+t.dataset.gapprove,{method:'PATCH',body:JSON.stringify({status:'active'})});setStatus('目的にしました。ネットワークに星として現れます。');await load();return;}
    if(t.dataset.greject){const k='gr'+t.dataset.greject;if(ui.armed!==k){ui.armed=k;render();return;}ui.armed=null;await api('/api/goals/'+t.dataset.greject,{method:'PATCH',body:JSON.stringify({status:'dropped'})});setStatus('候補を見送りました。');await load();return;}
    if(t.dataset.gpin){const g=goalsAll().find(x=>x.id===Number(t.dataset.gpin));await api('/api/goals/'+g.id,{method:'PATCH',body:JSON.stringify({pinned:!g.pinned})});await load();return;}
    if(t.dataset.gstatus){const [id,st]=t.dataset.gstatus.split('|');await api('/api/goals/'+id,{method:'PATCH',body:JSON.stringify({status:st})});await load();return;}
    if(t.dataset.gdone){const k='gd'+t.dataset.gdone;if(ui.armed!==k){ui.armed=k;render();return;}ui.armed=null;await api('/api/goals/'+t.dataset.gdone,{method:'PATCH',body:JSON.stringify({status:'done'})});ui.view='goals';setStatus('おめでとうございます。目的を達成にしました。');await load();return;}
    if(t.dataset.gdrop){const k='gx'+t.dataset.gdrop;if(ui.armed!==k){ui.armed=k;render();return;}ui.armed=null;await api('/api/goals/'+t.dataset.gdrop,{method:'PATCH',body:JSON.stringify({status:'dropped'})});ui.view='goals';setStatus('目的を手放しました。');await load();return;}
    if(t.dataset.ms){const [gid,mid]=t.dataset.ms.split('|');await api(`/api/goals/${gid}/milestones/${mid}`,{method:'PATCH',body:JSON.stringify({done:t.checked})});await load();return;}
    if(t.dataset.msadd){const v=$('ms-new').value.trim();if(!v){setStatus('道のりの名前を入れてください。',true);return;}await api(`/api/goals/${t.dataset.msadd}/milestones`,{method:'POST',body:JSON.stringify({title:v})});await load();return;}
    if(t.dataset.node==='act'){openAct(t);return;}
    if(t.dataset.actclose!==undefined){closeAct();return;}
    if(t.dataset.acttab){const to=t.dataset.acttab;if(to!=='brain')ui.view=to;closeAct();if(to!=='brain')$('panel').scrollIntoView({block:'start'});return;}
    if(t.dataset.actgoals!==undefined){ui.view='goals';closeAct();$('panel').scrollIntoView({block:'start'});return;}
    if(t.dataset.actgoal){ui.view='goal';ui.goal=Number(t.dataset.actgoal);closeAct();$('panel').scrollIntoView({block:'start'});return;}
    if(t.dataset.tgoal){const id=Number(t.dataset.tgoal);ui.tgoal=ui.tgoal===id?null:id;render();return;}
    if(t.dataset.tscope){ui.tscope=t.dataset.tscope;render();return;}
    if(t.dataset.tarea){ui.tarea=t.dataset.tarea;render();return;}
    if(t.dataset.tshift!==undefined){const n=Number(t.dataset.tshift);ui.tdate=n===0?new Date():shiftDate(ui.tscope||'day',ui.tdate||new Date(),n);render();return;}
    if(t.id==='t-add'){addTaskUI();return;}
    if(t.dataset.area){const u=localUnit(t.dataset.area);const a=areaOf(u)==='life'?'work':'life';u.area=a;render();await patch(u.id,{area:a});return;}
    if(t.dataset.drawer!==undefined){ui.drawer=t.dataset.drawer||null;renderMemList();$('panel').scrollIntoView({behavior:'smooth',block:'start'});return;}
    if(t.dataset.view||t.dataset.node){
      if((recorder&&recorder.state==='recording')||live){setStatus('録音中です。止めてから切り替えてください。',true);return;}
      if(prog){setStatus('アップロードの処理中です。終わるまでこのままお待ちください。',true);return;}
      if(t.dataset.node){if(ui.layer!==t.dataset.node){ui.q='';ui.drawer=null;}ui.view='layer';ui.layer=t.dataset.node;}else ui.view=t.dataset.view;
      ui.armed=null;if(ui.view!=='rec')ui.result=null;if(ui.view==='growth')ui.growth=null;setStatus('');render();
      if(window.innerWidth<700)$('panel').scrollIntoView({behavior:'smooth',block:'start'});return;}
    if(t.id==='recbtn'){if(state.canSummarizeAudio||state.canTranscribe)toggleRecord();else toggleLive();return;}
    if(t.id==='vsave'){saveVoiceText();return;}
    if(t.id==='gsync'){t.disabled=true;setStatus('Gmail・Googleチャットを読み取っています…');const r=await api('/api/google/sync',{method:'POST'});ui.account=null;setStatus(r.error?r.error:`取り込みました（${r.result}）。整理はルーティンか「knowkinの未整理メモを整理して」で行われます。`,!!r.error);await load();return;}
    if(t.id==='gunlink'){if(ui.armed!=='gunlink'){ui.armed='gunlink';t.textContent='もう一度押すと解除します';t.classList.add('on');return;}
      ui.armed=null;await api('/api/google/disconnect',{method:'POST'});ui.account=null;setStatus('Googleとの連携を解除しました。');render();return;}
    if(t.dataset.catok){await api('/api/categories/'+t.dataset.catok,{method:'PATCH',body:JSON.stringify({reviewed:true})});await load();return;}
    if(t.dataset.catmerge){const into=$('merge-'+t.dataset.catmerge).value;await api(`/api/categories/${t.dataset.catmerge}/merge`,{method:'POST',body:JSON.stringify({into})});setStatus('既存の種類にまとめました。');await load();return;}
    if(t.id==='ppick'){$('pfile').click();return;}
    if(t.id==='psave'){sendPhoto();return;}
    if(t.id==='pick'){$('file').click();return;}
    if(t.dataset.p){const i=$('input');i.value+=(i.value&&!i.value.endsWith('\n')?'\n':'')+t.dataset.p;i.focus();return;}
    if(t.id==='save'){remember();return;}
    if(t.id==='grow'){t.disabled=true;setStatus('記憶を読み直して、核をまとめています…');try{await api('/api/core/grow',{method:'POST'});setStatus('核を育てました。');await load();}catch(err){setStatus(err.message,true);t.disabled=false;}return;}
    if(t.id==='copy'){const txt=await api('/api/handoff');const area=$('copyarea');
      area.innerHTML=`<textarea class="copybox" readonly aria-label="Claudeに渡す文章">${esc(txt)}</textarea><p class="status">コネクタ未登録のClaudeで使うときは、この文章を会話の最初に貼ってください。</p>`;
      area.querySelector('textarea').select();try{await navigator.clipboard.writeText(txt);area.querySelector('.status').textContent='コピーしました。';}catch(_){}return;}
    if(t.dataset.done){const u=localUnit(t.dataset.done);u.done=t.checked;render();await patch(u.id,{done:t.checked});await load();return;}
    if(t.dataset.ok){const u=localUnit(t.dataset.ok);u.reviewed=true;render();await patch(u.id,{reviewed:true});return;}
    if(t.dataset.del){if(ui.armed!==t.dataset.del){ui.armed=t.dataset.del;render();return;}
      const id=Number(t.dataset.del);state.units=state.units.filter(u=>u.id!==id);ui.armed=null;render();await api('/api/units/'+id,{method:'DELETE'});return;}
    if(t.id==='okall'){const ids=state.units.filter(u=>!u.reviewed).map(u=>u.id);state.units.forEach(u=>u.reviewed=true);render();for(const id of ids)await patch(id,{reviewed:true});return;}
    if(t.dataset.reclass){t.disabled=true;setStatus('分類しています…');const r=await api(`/api/memos/${t.dataset.reclass}/classify`,{method:'POST'});setStatus(`${r.added}件の記憶を残しました。`);await load();return;}
  }catch(err){if(err.message!=='unauthorized')setStatus('うまくいきませんでした：'+err.message,true);}
});
document.addEventListener('change',async e=>{
  const s=e.target;
  if(s.dataset&&s.dataset.move){const v=s.value;if(!v)return;const u=localUnit(s.dataset.move);
    const body=v==='none'?{scope:''}:{scope:v,period:periodKey(v,new Date())};
    try{await patch(u.id,body);setStatus(v==='none'?'「いつか」に移しました。':`${{day:'今日',week:'今週',month:'今月',year:'今年'}[v]}に移しました。`);await load();}catch(err){setStatus(err.message,true);}return;}
  if(!s.dataset||!s.dataset.retype)return;const u=localUnit(s.dataset.retype);u.type=s.value;render();
  try{await patch(u.id,{type:s.value});}catch(err){setStatus('種類の変更に失敗しました：'+err.message,true);}
});
['a-email','a-pass','a-name','a-code'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')submitAuth();}));
