<style>
:root{

  --cyan:#5CD2FF;--violet:#9B7CFF;--pink:#FF6FC8;--accent:#5CD2FF;--accent-ink:#04101F;--red:#FF7A9A;
  --l-event:#5CD2FF;--l-know:#6F9BFF;--l-think:#B07CFF;--l-act:#FF6FC8;--l-rel:#4FE3C1;
  color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050A1C}}
:root[data-theme="dark"]{--bg:#050A1C}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Zen Kaku Gothic New",-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:16px;line-height:1.7;
  background:radial-gradient(1200px 700px at 50% 0%,#12235A 0%,var(--bg) 60%) fixed,var(--bg)}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;padding:22px 16px 72px}
.brand{display:flex;align-items:center;gap:12px;color:var(--cyan)}
.brand img{width:40px;height:40px;flex:none}
.mark{font-family:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;font-weight:400;font-size:34px;line-height:1;margin:0;color:var(--ink);letter-spacing:.01em}
.tagline{color:var(--muted);margin:6px 0 16px;font-size:14px}

.space{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(60% 55% at 50% 50%,#1B2E72 0%,#0B1437 55%,#050A1C 100%)}
.space-head{position:absolute;left:18px;right:18px;top:14px;display:flex;justify-content:space-between;align-items:baseline;z-index:3;pointer-events:none}
.space-title{margin:0;font-size:15px;font-weight:500;color:var(--muted);letter-spacing:.08em}
.space-date{font-size:14px;color:var(--muted)}
.map{position:relative;aspect-ratio:16/10;min-height:380px}
@media (max-width:620px){.map{aspect-ratio:3/5.1}}
.map canvas{position:absolute;inset:0;width:100%;height:100%}
.map svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.map svg.links path{fill:none;stroke:url(#linkGrad);stroke-width:2;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(155,124,255,.9))}
.map svg.links path.flow{stroke:#fff;stroke-width:1.4;stroke-dasharray:2 22;opacity:.8;filter:none}
@media (prefers-reduced-motion:no-preference){.map svg.links path.flow{animation:flow 2.4s linear infinite}}
@keyframes flow{to{stroke-dashoffset:-48}}

.node{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);z-index:2;background:none;border:0;padding:0;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .2s}
@media (max-width:620px){.node{left:var(--mx);top:var(--my)}}
.orb{width:clamp(46px,7vw,64px);height:clamp(46px,7vw,64px);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0%,var(--c) 28%,color-mix(in srgb,var(--c) 35%,transparent) 62%,transparent 72%);
  box-shadow:0 0 18px 4px color-mix(in srgb,var(--c) 55%,transparent),0 0 44px 10px color-mix(in srgb,var(--c) 22%,transparent)}
.node .name{font-weight:700;font-size:clamp(15px,2.2vw,19px);letter-spacing:.06em;text-shadow:0 0 10px color-mix(in srgb,var(--c) 80%,transparent)}
.node .count{font-size:12px;color:var(--muted);min-height:1.2em;margin-top:-4px}
.node:hover{transform:translate(-50%,-50%) scale(1.07)}
.node[aria-pressed="true"] .orb{box-shadow:0 0 0 2px #fff,0 0 24px 8px color-mix(in srgb,var(--c) 70%,transparent),0 0 60px 16px color-mix(in srgb,var(--c) 30%,transparent)}
.node.core{gap:2px}
.node.core .brain{width:clamp(110px,17vw,168px);height:auto;color:#BDEBFF;
  filter:drop-shadow(0 0 6px #5CD2FF) drop-shadow(0 0 22px rgba(92,210,255,.75)) drop-shadow(0 0 48px rgba(176,124,255,.55))}
@media (prefers-reduced-motion:no-preference){.node.core .brain{animation:pulse 3.2s ease-in-out infinite}}
@keyframes pulse{0%,100%{opacity:.88}50%{opacity:1}}
.node.core .name,.node.core .count{background:rgba(6,12,34,.72);border-radius:10px;padding:0 10px}
.node.core .name{font-size:clamp(20px,3vw,26px);text-shadow:0 0 14px rgba(92,210,255,.9)}
.node.core .count{color:var(--cyan)}
.node.core[aria-pressed="true"] .brain{color:#fff}

.goal{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);z-index:2;background:none;border:0;padding:0;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px;max-width:34%;transition:transform .2s}
.goal:hover{transform:translate(-50%,-50%) scale(1.07)}
@media (max-width:620px){.goal{left:var(--mx);top:var(--my)}}
.sw{filter:drop-shadow(0 0 5px var(--sc)) drop-shadow(0 0 14px var(--sc));opacity:var(--o);line-height:0}
.star{display:block;width:var(--s);height:var(--s);background:radial-gradient(circle,#fff 0 18%,var(--sc) 45%);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
.goal .gname{font-size:12px;font-weight:700;text-align:center;line-height:1.35;text-shadow:0 0 8px rgba(0,0,0,.8)}
.goal .gpct{font-size:11px;color:var(--sc)}
.goal .gpct.stall{color:#FFB86B}
.goal-hint{position:absolute;left:50%;top:13%;transform:translate(-50%,-50%);z-index:2;font-size:12px;color:var(--muted);background:none;border:1px dashed var(--line);border-radius:999px;padding:4px 12px}
.gpath{position:relative;height:18px;margin:10px 4px 0}
.gpath .base{position:absolute;top:8px;left:0;right:8%;height:2px;background:var(--line)}
.gpath::before{content:'';position:absolute;top:4px;left:0;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--gc)}
.gpath .fill{position:absolute;top:8px;left:0;height:2px;background:var(--gc)}
.gpath .ms{position:absolute;top:4px;width:10px;height:10px;margin-left:-5px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface)}
.gpath .ms.done{background:var(--gc);border-color:var(--gc)}
.gpath .here{position:absolute;top:2px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;box-shadow:0 0 8px var(--gc)}
.gpath .flag{position:absolute;right:0;top:-3px;color:var(--gc);font-size:16px}
.gcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px;color:var(--ink)}
.gcard:hover{border-color:var(--gc)}
.gtop{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.gbadge{font-size:12px;padding:1px 9px;border-radius:999px;border:1px solid var(--gc);color:var(--gc)}
.gtitle{font-size:16px;font-weight:700;margin:6px 0 2px}
.gfuture{font-size:13px;color:var(--muted);margin:0}
.gnow{font-size:13px;margin:8px 0 0}.gnow b{color:var(--gc)}
.future-box{border-left:3px solid var(--gc);padding:2px 0 2px 12px;margin:10px 0 14px}
.future-box p{margin:0}.future-box .lbl{font-size:12px;color:var(--muted);margin-top:8px}
.msl{list-style:none;margin:0;padding:0}.msl li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.msl li.done span{text-decoration:line-through;color:var(--muted)}.msl .nowtag{margin-left:auto;font-size:12px;color:var(--gc)}
.goaltag{margin-left:6px;font-size:11px;font-weight:500;color:#FFD66B;border:1px solid rgba(255,214,107,.5);border-radius:999px;padding:0 6px}
.lock{overflow:hidden}
.lock #status{position:fixed;left:16px;right:16px;bottom:78px;z-index:60;margin:0;padding:9px 14px;border-radius:12px;background:#16372A;color:#fff;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.lock #status.err{background:#8A3B12;color:#fff}
.lock #status:empty{display:none}
.actview{position:fixed;inset:0;z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch;
  --bg:#FFFFFF;--bg2:#F6FAF7;--surface:#FFFFFF;--surface2:#E3EFE7;--ink:#16372A;--muted:#6B7F74;--line:#DDE8E1;--cyan:#1F7A4D;--accent-ink:#FFFFFF;--pink:#1F7A4D;--red:#B7791F;--g:#1F7A4D;--g2:#4FA57A;--soft:#EAF5EE;--l-rel:#1F7A4D;
  background:var(--bg);color:var(--ink);color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  clip-path:circle(0 at var(--ox,50%) var(--oy,50%));transition:clip-path .32s ease}
.actview.open{clip-path:circle(150% at var(--ox,50%) var(--oy,50%))}
@media (prefers-reduced-motion:reduce){.actview{transition:none}}
.av-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.av-back{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1;color:var(--ink)}
.av-orb{width:28px;height:28px;border-radius:50%;background:var(--soft);border:2px solid var(--g);display:flex;align-items:center;justify-content:center}.av-orb::after{content:'';width:11px;height:11px;border-radius:50%;background:var(--g)}
.av-top h1{margin:0;font-size:21px;letter-spacing:.06em}.av-date{margin-left:auto;font-size:13px;color:var(--muted)}
.av-body{max-width:720px;margin:0 auto;padding:6px 16px 90px}
.av-sh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}.av-sh h2{margin:0;font-size:14px;font-weight:500;color:var(--muted);letter-spacing:.1em}
.actview .linkbtn{color:var(--g)}
.av-cand{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:0 0 10px;background:var(--soft);border:1px dashed var(--g);border-radius:12px;font-size:14px}
.av-cand small{color:var(--muted)}.av-cand button{margin-left:auto;flex:none;background:var(--g);color:#fff;border:0;border-radius:8px;padding:6px 12px;font-weight:700}
.av-goals{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;margin:0 -16px;padding:2px 16px 8px}
.agc{flex:0 0 78%;max-width:340px;scroll-snap-align:start;border:1px solid var(--line);border-radius:16px;background:var(--bg);display:flex;flex-direction:column}
.agc.sel{border-color:var(--g);box-shadow:0 0 0 1px var(--g) inset;background:var(--soft)}
.agc-main{display:flex;flex-direction:column;gap:6px;text-align:left;background:none;border:0;padding:12px 14px 6px;color:var(--ink)}
.agc-top{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.agc-star{width:16px;height:16px;background:var(--g);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
.agc.life .agc-star{background:var(--g2)}
.agc-pct{margin-left:auto;font-size:16px;color:var(--g)}.agc.life .agc-pct{color:var(--g2)}
.agc-stall{color:#B7791F;margin-left:4px}
.agc-title{font-size:16px;font-weight:700}
.agc-now{font-size:12px;color:var(--muted)}.agc-now b{color:var(--g)}
.agc-foot{display:flex;align-items:center;gap:8px;padding:0 14px 10px}
.agc-more{margin-left:auto;background:none;border:0;color:var(--g);font-size:12px;padding:0}
.agc-gen{background:var(--soft);border:1px solid var(--g);color:var(--g);border-radius:999px;font-size:12px;padding:3px 10px;font-weight:700}
.agc-req{font-size:12px;color:var(--muted)}
.tprop{margin:3px 0 0;font-size:12px;color:var(--g,#6FCF97)}
.actview .gpath{--gc:var(--g)!important}.actview .agc.life .gpath{--gc:var(--g2)!important}
.actview .gpath .fill,.actview .gpath .ms.done,.actview .gpath::before{background:var(--gc)!important}.actview .gpath .ms.done{border-color:var(--gc)!important}.actview .gpath .flag{color:var(--gc)!important}
.actview .gpath .here{background:#fff;border:3px solid var(--gc);box-shadow:none;width:14px;height:14px}
.av-empty{color:var(--muted);font-size:14px}
.actview .seg{background:var(--bg2)}
.actview .seg button[aria-selected="true"]{background:var(--g);color:#fff}
.actview .seg.sub button[aria-selected="true"]{background:var(--soft);color:var(--g);box-shadow:0 0 0 1px var(--g) inset}
.actview .pnav button:not(.linkbtn){background:var(--bg)}
.actview .pcount{margin-left:auto;font-style:normal;font-size:13px;color:var(--muted)}
.actview .tbar{height:6px;border-radius:999px;background:var(--surface2);overflow:hidden;margin:0 0 12px}.actview .tbar span{display:block;height:100%;background:var(--g)}
.actview .tadd input{background:var(--bg2)}
.actview .primary{background:var(--g);color:#fff;box-shadow:none}
.actview .check{accent-color:var(--g)}
.actview .abadge.work{color:var(--g);border-color:var(--g)}.actview .abadge.life{color:var(--g2);border-color:var(--g2);background:var(--soft)}
.actview .goaltag{color:var(--g);border-color:var(--g)}
.actview .warn{color:#B7791F}
.actview h4{color:var(--muted)}
.gfilter{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:6px 12px;border-radius:999px;background:var(--soft,rgba(255,214,107,.1));color:var(--g,#FFD66B);font-size:13px;font-weight:700}
.gfilter .linkbtn{margin-left:auto;font-size:12px}
.pcount{margin-left:auto;font-style:normal;font-size:13px;color:var(--muted)}
.tbar{height:6px;border-radius:999px;background:var(--surface2);overflow:hidden;margin:0 0 12px}.tbar span{display:block;height:100%;background:var(--cyan)}
.av-tab{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;justify-content:space-around;background:var(--bg);border-top:1px solid var(--line);padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.av-tab button{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;font-size:11px;color:var(--muted);min-width:64px}
.av-tab button span{width:8px;height:8px;border-radius:50%;background:currentColor}
.av-tab .on{color:var(--g);font-weight:700}
.gr-hero{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.gr-lbl{margin:0;font-size:13px;color:var(--muted)}
.gr-big{margin:2px 0;font-size:44px;font-weight:800;line-height:1.1;color:#6FCF97}.gr-big small{font-size:20px;margin-left:2px}
.gr-sub{margin:0;font-size:12px;color:var(--muted)}
.spark{width:140px;height:36px;flex:none}
.gr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:22px}
.gr-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.gr-num{margin:0;font-size:28px;font-weight:800}.gr-num small{font-size:14px;margin-left:2px;color:var(--muted)}
.lbar{display:flex;align-items:center;gap:6px;font-size:12px}.lbar-n{width:3.5em;color:var(--muted)}.lbar-t{flex:1;height:6px;border-radius:999px;background:var(--surface2);overflow:hidden}.lbar-t span{display:block;height:100%;border-radius:999px}.lbar-c{width:2em;text-align:right}
.gr-hints{margin:0;padding-left:1.2em;color:var(--ink)}.gr-hints li{margin:4px 0}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.quiz .q{margin:0;font-weight:700}
.quiz .pred{margin:8px 0 0;padding:8px 12px;border-left:3px solid var(--violet);background:var(--bg2);border-radius:0 8px 8px 0}.quiz .pred span{display:block;font-size:12px;color:var(--muted)}
.quiz .basis{margin:6px 0 0;font-size:12px;color:var(--muted)}
.qbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.qbtns button{flex:1;min-width:90px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 6px;font-weight:700}
.spaces{list-style:none;margin:0;padding:0;max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.spaces li{border-bottom:1px solid var(--line)}.spaces li:last-child{border-bottom:0}
.spaces label{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:14px}
.spaces label span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.spaces small{color:var(--muted)}
.spaces input{width:18px;height:18px;accent-color:var(--cyan)}
.ask-stat{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:0 0 14px}.ask-stat b{color:var(--ink);font-size:15px;margin-right:2px}
.ask{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.ask.main{border-color:var(--cyan);margin-bottom:14px;background:linear-gradient(135deg,rgba(92,210,255,.12),rgba(176,124,255,.10)),var(--surface)}
.ask-t{margin:0;font-weight:700;font-size:16px}.ask-d{margin:0;font-size:13px;color:var(--muted)}.ask-q{margin:2px 0 6px;font-size:12px;color:var(--cyan)}
.ask-b{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.ask-b .primary{text-decoration:none;display:inline-block}
.asks{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.asks .ask{padding:12px}.asks .ask-t{font-size:15px}.asks .ask-d{font-size:12px}.asks .ask-q{display:none}
.asks .ask-b .primary,.asks .ask-b .ghost{padding:7px 10px;font-size:13px}
.magnet.ask-m::before{background:var(--violet);box-shadow:0 0 8px var(--violet)}
.magnets{display:flex;gap:10px;justify-content:flex-end;margin:12px 2px 0;flex-wrap:wrap}

.magnet::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.magnet[aria-pressed="true"]{border-color:var(--cyan)}
.magnet .n{color:var(--pink);font-weight:700}

.panel{margin-top:30px}
.panel h2{font-weight:700;font-size:24px;margin:0 0 4px;color:var(--ink);letter-spacing:.04em}
.panel .lead{color:var(--muted);margin:0 0 16px;font-size:15px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.rec-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.recbtn{display:flex;align-items:center;gap:10px;border:0;border-radius:999px;background:linear-gradient(90deg,#FF5FA8,#B07CFF);color:#fff;padding:12px 22px;font-weight:700;box-shadow:0 0 18px rgba(255,95,168,.45)}
.recbtn .dot{width:12px;height:12px;border-radius:50%;background:#fff}
.recbtn.on .dot{border-radius:2px}
.timer{font-variant-numeric:tabular-nums;color:var(--muted)}

.drop strong{color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--cyan);text-decoration:underline;font-weight:700}
.primary{background:var(--cyan);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 20px;font-weight:700;box-shadow:0 0 14px rgba(92,210,255,.4)}

<div class="wrap">

    </div>

<script>
const TYPES={event:{label:'記憶',layer:'event'},input:{label:'インプット',layer:'know'},lesson:{label:'フィードバック・教訓',layer:'know'},idea:{label:'アイディア',layer:'think'},decision:{label:'判断と理由',layer:'think'},value:{label:'価値観',layer:'think'},question:{label:'未解決の問い',layer:'think'},task:{label:'タスク',layer:'act'},goal:{label:'目標',layer:'act'},person:{label:'人物',layer:'rel'}};
const LAYERS=[{id:'event',label:'出来事'},{id:'know',label:'知識'},{id:'think',label:'思考'},{id:'act',label:'行動'},{id:'rel',label:'関係'}];
// 自動で作られたカテゴリも含めて、種類と層を引く
const cats=()=>(state&&state.categories)||[];
function T(key){
  if(TYPES[key])return TYPES[key];

async function api(path,opts={}){
  const headers={...(opts.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opts.headers||{})};
  const r=await fetch(path,{...opts,headers,credentials:'same-origin'});
  if(r.status===401&&!path.startsWith('/api/auth/')){showLogin('ログインが切れました。もう一度ログインしてください。');throw new Error('unauthorized');}
  const body=(r.headers.get('content-type')||'').includes('json')?await r.json():await r.text();

async function boot(){

function proj(x,y,z){

async function toggleRecord(){
  if(recorder&&recorder.state==='recording'){recorder.stop();return;}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const type=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
    recorder=new MediaRecorder(stream,type?{mimeType:type}:undefined);chunks=[];
    recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
    recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());clearInterval(recTimer);
      const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});
      $('recbtn').classList.remove('on');$('reclabel').textContent='録音をはじめる';
      sendAudio(blob,(recorder.mimeType||'').includes('mp4')?'recording.m4a':'recording.webm');};
    recorder.start(1000);recStart=Date.now();
    $('recbtn').classList.add('on');$('reclabel').textContent='録音を止めて要約する';
    recTimer=setInterval(()=>{const s=Math.floor((Date.now()-recStart)/1000);$('timer').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} 録音中`;},500);
    setStatus('');
  }catch(e){setStatus('マイクを使えませんでした。ブラウザの設定でマイクを許可するか、ボイスメモをアップロードしてください。',true);}
}
// 無料の録音：ブラウザの音声認識で、話しながら文字にする
let live=null;
function toggleLive(){
  if(live){live.stop=true;try{live.rec.stop();}catch(_){}return;}
  const box=$('vtext');const base=box.value;const sep=base&&!base.endsWith('\n')?'\n':'';
  live={stop:false,fin:'',start:Date.now(),rec:null,timer:null};
  const begin=()=>{
    const rec=new SRC();rec.lang='ja-JP';rec.continuous=true;rec.interimResults=true;live.rec=rec;
    rec.onresult=ev=>{let interim='';for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal)live.fin+=r[0].transcript+'。';else interim+=r[0].transcript;}
      const b=$('vtext');if(b)b.value=base+sep+live.fin+interim;};
    rec.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){live.stop=true;setStatus('マイクの使用が許可されていません。ブラウザの設定でマイクを許可してください。',true);}};
    rec.onend=()=>{if(live&&!live.stop){try{begin();}catch(_){finishLive();}}else finishLive();}; // iPhoneは無音で止まるので続ける
    rec.start();
  };
  try{begin();}catch(_){live=null;setStatus('音声の文字起こしを始められませんでした。',true);return;}
  $('recbtn').classList.add('on');$('reclabel').textContent='止める';setStatus('聞いています。話し終わったら「止める」を押してください。');
  live.timer=setInterval(()=>{const s=Math.floor((Date.now()-live.start)/1000);const t=$('timer');if(t)t.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} 文字にしています`;},500);
}
function finishLive(){
  if(!live)return;clearInterval(live.timer);live=null;
  const b=$('recbtn');if(b){b.classList.remove('on');$('reclabel').textContent='話しながら文字にする';}
  const t=$('timer');if(t)t.textContent='';
  setStatus('文字にしました。内容を確認して「録音として残す」を押してください。');
}

// ---- アップロードの進み具合 ----
const STAGES=[{id:'upload',label:'送信'},{id:'convert',label:'変換'},{id:'ai',label:'文字起こし・要約'},{id:'save',label:'振り分け'}];
let prog=null;
function progressHTML(name,size){
  return `<div class="prog" id="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="アップロードの進み具合">
    <div class="prog-file"><span>${esc(name)}</span><span>${(size/1024/1024).toFixed(1)}MB</span></div>
    <div class="prog-bar"><span id="prog-fill"></span></div>
    <div class="prog-row"><span id="prog-label">アップロード中 0%</span><span id="prog-time"></span></div>
    <ol class="prog-steps">${STAGES.map(s=>`<li data-step="${s.id}">${s.label}</li>`).join('')}</ol></div>`;
}
function setProg(pct,label){
  if(!prog)return;prog.pct=Math.max(prog.pct,Math.min(100,pct));
  const f=$('prog-fill'),l=$('prog-label'),bar=$('prog');
  if(f)f.style.width=prog.pct.toFixed(1)+'%';if(bar)bar.setAttribute('aria-valuenow',Math.round(prog.pct));if(l&&label)l.textContent=label;
}
function setStep(id){
  if(!prog)return;prog.stage=id;prog.stageAt=Date.now();const idx=STAGES.findIndex(s=>s.id===id);
  document.querySelectorAll('.prog-steps li').forEach((li,i)=>{li.className=i<idx?'done':i===idx?'now':'';});
}
function tickProg(){
  if(!prog)return;const s=Math.floor((Date.now()-prog.start)/1000);const t=$('prog-time');if(t)t.textContent=`経過 ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  if(prog.stage==='ai'){const est=prog.est||30;const e=(Date.now()-prog.stageAt)/1000;
    setProg(42+48*(1-Math.exp(-e/est)),`文字起こしと要約をしています（目安 ${est<60?'1分以内':Math.round(est/60)+'分ほど'}）`);}
}
function uploadVoice(fd,onUp,onLine){
  return new Promise((resolve,reject)=>{
    const x=new XMLHttpRequest();x.open('POST','/api/voice');x.setRequestHeader('Accept','application/x-ndjson');
    let seen=0,buf='';
    const read=()=>{buf+=x.responseText.slice(seen);seen=x.responseText.length;let i;
      while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i);buf=buf.slice(i+1);if(line.trim()){try{onLine(JSON.parse(line));}catch(_){}}}};
    x.upload.onprogress=e=>{if(e.lengthComputable)onUp(e.loaded/e.total);};
    x.upload.onload=()=>onUp(1);
    x.onprogress=read;
    x.onload=()=>{
      if(x.status===401){showLogin('ログインが切れました。もう一度ログインしてください。');return reject(new Error('unauthorized'));}
      if(x.status>=400){let m='アップロードに失敗しました';try{m=JSON.parse(x.responseText).error||m;}catch(_){}return reject(new Error(m));}
      read();resolve();
    };
    x.onerror=()=>reject(new Error('通信が切れました。電波のよい場所でもう一度お試しください。'));
    x.send(fd);
  });
}
async function sendAudio(blob,name){
  if(busy)return;
  if(blob.size>100*1024*1024){setStatus('ファイルが大きすぎます（100MBまで）。',true);return;}
  busy=true;const t=$('timer');if(t)t.textContent='';setStatus('');
  document.querySelectorAll('#recbtn,#pick').forEach(b=>b.disabled=true);
  ui.result=null;const box=$('result');if(box)box.innerHTML=progressHTML(name,blob.size);
  prog={pct:0,start:Date.now(),stage:'upload',stageAt:Date.now(),est:30,timer:null};setStep('upload');
  prog.timer=setInterval(tickProg,300);
  let result=null,failure=null;
  try{
    const fd=new FormData();fd.append('file',blob,name);
    await uploadVoice(fd,
      p=>{if(prog.stage==='upload')setProg(p*30,p<1?`アップロード中 ${Math.round(p*100)}%`:'アップロードが終わりました');},
      m=>{
        if(m.stage==='received'){setProg(32,'サーバーで受け取りました');}
        else if(m.stage==='convert'){setStep('convert');setProg(35,'音声を変換しています');}
        else if(m.stage==='ai'){setStep('ai');prog.est=Math.max(15,15+(m.minutes||1)*6);setProg(42,'文字起こしと要約をしています');}
        else if(m.stage==='save'){setStep('save');setProg(93,'記憶に振り分けています');}
        else if(m.stage==='done'){result=m.result;}
        else if(m.stage==='error'){failure=m.error;}
      });
    if(failure)throw new Error(failure);
    if(!result)throw new Error('処理の結果を受け取れませんでした。「最近の録音」に入っていないか確認してください。');
    setStep('done');setProg(100,'完了しました');
    document.querySelectorAll('.prog-steps li').forEach(li=>li.className='done');
    ui.result=result;clearInterval(prog.timer);prog=null;
    setStatus('記憶に残しました。');await load();
  }catch(e){
    if(prog){clearInterval(prog.timer);prog=null;}
    if(e.message!=='unauthorized'){setStatus(e.message,true);render();}
  }
  busy=false;
}

async function remember(){

  if(!text){setStatus('残す内容を入力してください。',true);$('input').focus();return;}
  busy=true;$('save').disabled=true;setStatus('保存しています…');
  try{const r=await api('/api/memos',{method:'POST',body:JSON.stringify({text})});$('input').value='';
    setStatus(r.pending?'原本を保存しました。Claudeとの会話で「knowkinの未整理メモを整理して」と頼むと、分類されて記憶に入ります。':r.error?r.error+'。「見直し」から分類し直せます。':`${r.added}件の記憶を残しました${r.repeated?`。${r.repeated}件は前にもあった内容なので、重みを上げました`:''}。`,!!r.error);
    await load();}
  catch(e){if(e.message!=='unauthorized')setStatus('保存に失敗しました：'+e.message,true);}
  busy=false;const s=$('save');if(s)s.disabled=false;
}
function setupMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const btn=$('mic');if(!SR||!btn)return;btn.hidden=false;
  let rec=null,listening=false;
  btn.addEventListener('click',()=>{
    if(listening){rec.stop();return;}
    const input=$('input');const base=input.value;const sep=base&&!base.endsWith('\n')?'\n':'';let fin='';
    try{rec=new SR();}catch(_){setStatus('マイクを使えません。キーボードの音声入力で話してください。',true);return;}
    rec.lang='ja-JP';rec.continuous=true;rec.interimResults=true;
    rec.onresult=ev=>{let interim='';for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal)fin+=r[0].transcript;else interim+=r[0].transcript;}input.value=base+sep+fin+interim;};
    rec.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed')setStatus('マイクの使用が許可されていません。キーボードの音声入力で話してください。',true);};
    rec.onend=()=>{listening=false;btn.textContent='話して入力';btn.classList.remove('on');};
    try{rec.start();listening=true;btn.textContent='止める';btn.classList.add('on');}catch(_){setStatus('マイクを開始できませんでした。',true);}
  });
}

// ---- 引き出し：層の中をテーマ（関係は人物）ごとに分ける ----
const cleanTag=t=>String(t||'').replace(/^#/,'').trim();
/** 人物の記憶の主語：本文の先頭に近い位置に名前が出てくる人（なければ people の先頭） */
function subjectOf(u,names){
  const c=String(u.content||'');let best=names[0],pos=Infinity;
  for(const n of names){const base=n.replace(/(さん|様|氏)$/,'');const i=c.indexOf(base);if(i>=0&&i<pos){pos=i;best=n;}}
  return best;
}
function drawersFor(layerId){
  const every=state.units||[];const all=every.filter(u=>!isPeri(u));
  const periDrawer=list=>list.length?[{key:'peri',label:'周辺の情報',units:list.slice().sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))),last:true,peri:true}]:[];
  if(layerId==='rel'){
    // 人物の記憶は「誰についての記憶か（主語）」の人だけに入れる。ほかの記憶は、名前が出てくる全員の「関わった記憶」に入れる
    const map=new Map();const get=k=>{if(!map.has(k))map.set(k,{about:[],with:[]});return map.get(k);};
    for(const u of all){
      const names=(u.people||[]).map(n=>String(n).trim()).filter(Boolean);if(!names.length)continue;
      if(layerOf(u)==='rel'){get(subjectOf(u,names)).about.push(u);}
      else for(const n of new Set(names))get(n).with.push(u);
    }
    const periRel=every.filter(u=>isPeri(u)&&(layerOf(u)==='rel'||(u.people||[]).length));
    const byNew=(a,b)=>String(b.created_at).localeCompare(String(a.created_at));
    const ds=[...map].filter(([,v])=>v.about.length||v.with.length>=2).map(([name,v])=>({key:'p:'+name,label:name,person:true,
      about:v.about.sort(byNew),with:v.with.sort(byNew),units:[...v.about.sort(byNew),...v.with.sort(byNew)]}));
    const orphan=all.filter(u=>layerOf(u)==='rel'&&!(u.people||[]).length);
    if(orphan.length)ds.push({key:'p:',label:'名前なし',units:orphan});
    const al=d=>(d.about||[]).length;
    return [...ds.sort((a,b)=>(al(b)-al(a))||(b.units.length-a.units.length)),...periDrawer(periRel).map(d=>({...d,label:'周辺の人'}))];
  }
  let list=all.filter(u=>layerOf(u)===layerId);
  const periList=every.filter(u=>isPeri(u)&&layerOf(u)===layerId);
  const ds=new Map();const add=(key,label,u)=>{if(!ds.has(key))ds.set(key,{key,label,units:[]});ds.get(key).units.push(u);};
  if(layerId==='act'){const done=list.filter(u=>u.done);list=list.filter(u=>!u.done);if(done.length)ds.set('done',{key:'done',label:'終わったもの',units:done,last:true});}
  if(layerId==='think'){for(const u of list)add('t:'+u.type,T(u.type).label,u);}
  else{
    const freq={};for(const u of list)for(const t of (u.tags||[]).map(cleanTag))if(t)freq[t]=(freq[t]||0)+1;
    for(const u of list){
      let g=(u.genre||'').trim();
      if(!g){const best=(u.tags||[]).map(cleanTag).filter(t=>freq[t]>=2).sort((a,b)=>freq[b]-freq[a])[0];g=best||'';}
      add('g:'+(g||'その他'),g||'その他',u);
    }
  }
  const arr=[...ds.values()];
  for(const d of arr){
    if(layerId==='act'&&!d.last)d.units.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));
    else d.units.sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
  }
  return [...arr.sort((a,b)=>(a.last?1:0)-(b.last?1:0)||(a.label==='その他')-(b.label==='その他')||b.units.length-a.units.length),...periDrawer(periList)];
}
function drawerPreview(d){
  const u=d.person?(d.units.find(x=>layerOf(x)==='rel')||d.units[0]):d.units[0];
  return u?u.content:'';
}
// ---- タスク管理（行動の層）：年・月・週・日 × 仕事・プライベート ----
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const fromYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
function isoWeekOf(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return {wy:t.getUTCFullYear(),w:Math.ceil(((t-y0)/86400000+1)/7)};}
function periodKey(scope,d){if(scope==='year')return String(d.getFullYear());if(scope==='month')return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;if(scope==='week'){const {wy,w}=isoWeekOf(d);return `${wy}-W${pad2(w)}`;}return ymd(d);}
function weekStart(wy,w){const jan4=new Date(wy,0,4);const day=jan4.getDay()||7;const mon=new Date(wy,0,4-day+1);mon.setDate(mon.getDate()+(w-1)*7);return mon;}
function rangeOf(scope,key){ // [開始, 終了] の日付文字列
  if(scope==='year')return [`${key}-01-01`,`${key}-12-31`];
  if(scope==='month'){const [y,m]=key.split('-').map(Number);return [`${key}-01`,ymd(new Date(y,m,0))];}
  if(scope==='week'){const [y,w]=key.split('-W').map(Number);const s=weekStart(y,w);const e=new Date(s);e.setDate(s.getDate()+6);return [ymd(s),ymd(e)];}
  return [key,key];
}
function shiftDate(scope,d,n){const x=new Date(d);if(scope==='year')x.setFullYear(x.getFullYear()+n);else if(scope==='month'){x.setDate(1);x.setMonth(x.getMonth()+n);}else if(scope==='week')x.setDate(x.getDate()+7*n);else x.setDate(x.getDate()+n);return x;}
function periodTitle(scope,d){
  const key=periodKey(scope,d);const today=new Date();const cur=key===periodKey(scope,today);
  const pre={day:'今日',week:'今週',month:'今月',year:'今年'}[scope];
  if(scope==='day')return (cur?'今日 ':'')+`${d.getMonth()+1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`;
  if(scope==='week'){const [s,e]=rangeOf('week',key).map(fromYmd);return (cur?'今週 ':'')+`${s.getMonth()+1}/${s.getDate()}〜${e.getMonth()+1}/${e.getDate()}`;}
  if(scope==='month')return (cur?'今月 ':'')+`${d.getFullYear()}年${d.getMonth()+1}月`;
  return (cur?'今年 ':'')+`${d.getFullYear()}年`;
}
const isTask=u=>u.type==='task'||u.type==='goal';
const areaOf=u=>u.area==='life'?'life':'work';
function effRange(u){ // タスクのやる時期を日付の範囲にする
  if(u.scope&&u.period)return rangeOf(u.scope,u.period);
  if(u.due)return [u.due,u.due];
  return null;
}
const SCOPE_LBL={day:'今日',week:'今週',month:'今月',year:'今年',someday:'いつか'};
const WD='日月火水木金土';
const md=s=>{const [,m,d]=s.split('-').map(Number);return `${m}/${d}`;};
function taskWhen(u,today){ // 行の右に出す、いつやるか
  if(u.due){if(u.due<today)return {t:md(u.due),late:true};if(u.due===today)return {t:'今日'};return {t:md(u.due)};}
  if(u.scope==='week')return {t:'今週'};if(u.scope==='month')return {t:'今月'};if(u.scope==='year')return {t:'今年'};
  return null;
}
function taskRowHTML(u,today){
  const g=u.goal_id&&goalsAll().find(x=>x.id===u.goal_id);
  let w=taskWhen(u,today);const open=ui.topen===u.id;
  const sc=ui.tscope||'day';if(w&&!w.late&&((sc==='day'&&(w.t==='今日'||w.t==='今週'))||(sc==='week'&&w.t==='今週')||(sc==='month'&&w.t==='今月')||(sc==='year'&&w.t==='今年')))w=null;
  const tdy=ymd(new Date()),tmr=ymd(shiftDate('day',new Date(),1));
  const curWhen=!u.scope&&!u.due?'none':u.scope==='day'&&u.period===tdy?'today':u.scope==='day'&&u.period===tmr?'tomorrow':u.scope==='week'?'week':u.scope==='month'?'month':'';
  const prop=(u.tags||[]).includes('提案')&&!u.reviewed;
  const sub=[g?`<span class="tk-goal">★ ${esc(g.title)}</span>`:'',(u.people||[]).length?`<span>${esc(u.people.join('、'))}</span>`:'',prop?'<span class="tk-prop">Claudeの提案</span>':''].filter(Boolean).join('');
  return `<li class="tk-row${u.done?' done':''}${open?' open':''}${w&&w.late&&!u.done?' late':''}">
    <button type="button" class="tk-check" data-tdone="${u.id}" aria-pressed="${!!u.done}" aria-label="${u.done?'未完了に戻す':'完了にする'}"><span></span></button>
    <button type="button" class="tk-main" data-topen="${u.id}" aria-expanded="${open}">
      <span class="tk-title">${esc(u.content)}</span>${sub?`<span class="tk-sub">${sub}</span>`:''}
    </button>
    ${w?`<span class="tk-when${w.late?' late':''}">${esc(w.t)}</span>`:''}
    ${open?`<div class="tk-tray">
      ${prop&&u.reason?`<p class="tk-reason">${esc(u.reason)}</p>`:''}
      <p class="tk-label">いつやる</p>
      <div class="tk-chips">${[['today','今日'],['tomorrow','明日'],['week','今週'],['month','今月'],['none','いつか']].map(([k,l])=>`<button type="button" data-twhen="${u.id}|${k}" aria-pressed="${curWhen===k}">${l}</button>`).join('')}</div>
      <div class="tk-chips"><button type="button" data-area="${u.id}">${areaOf(u)==='life'?'仕事に移す':'プライベートに移す'}</button>${g?`<button type="button" data-actgoal="${g.id}">目的を見る</button>`:''}<button type="button" class="tk-del${ui.armed===String(u.id)?' armed':''}" data-del="${u.id}">${ui.armed===String(u.id)?'もう一度押すと削除':'削除'}</button></div>
    </div>`:''}
  </li>`;
}
function taskGroup(title,list,today,cls=''){
  if(!list.length)return '';
  return `<section class="tk-group ${cls}"><h3>${title}<span>${list.length}</span></h3><ul>${list.map(u=>taskRowHTML(u,today)).join('')}</ul></section>`;
}
function renderTasks(p){
  const sc=ui.tscope||'day';const d=ui.tdate||new Date();const today=ymd(new Date());
  const gsel=ui.tgoal&&goalsAll().find(g=>g.id===ui.tgoal);if(!gsel)ui.tgoal=null;
  const all=state.units.filter(isTask).filter(u=>!ui.tgoal||u.goal_id===ui.tgoal);
  const byDue=(a,b)=>String(a.due||'9999').localeCompare(String(b.due||'9999'))||String(a.created_at).localeCompare(String(b.created_at));
  let inView=[],carry=[],week=[],isCur=true,vs='',ve='';
  if(sc==='someday'){inView=all.filter(u=>!effRange(u));}
  else{
    const key=periodKey(sc,d);[vs,ve]=rangeOf(sc,key);isCur=key===periodKey(sc,new Date());
    const wk=periodKey('week',new Date());
    for(const u of all){const r=effRange(u);if(!r)continue;
      if(r[0]>=vs&&r[0]<=ve&&!(sc==='day'&&u.scope==='week'))inView.push(u);
      else if(isCur&&!u.done&&r[1]<vs)carry.push(u);
      else if(sc==='day'&&isCur&&u.scope==='week'&&u.period===wk)week.push(u);}
  }
  const open=inView.filter(u=>!u.done).sort(byDue),done=inView.filter(u=>u.done);
  const work=open.filter(u=>areaOf(u)==='work'),life=open.filter(u=>areaOf(u)==='life');
  const tot=open.length+done.length;const pct=tot?Math.round(done.length/tot*100):0;
  // 日めくり：期間の見出し
  let big,small1,small2;
  if(sc==='day'){big=d.getDate();small1=`${d.getMonth()+1}月`;small2=`${WD[d.getDay()]}曜日${isCur?'・今日':''}`;}
  else if(sc==='week'){const [a,b]=[vs,ve].map(fromYmd);big=`${a.getDate()}`;small1=`${a.getMonth()+1}月${a.getDate()}日から`;small2=`${b.getMonth()+1}月${b.getDate()}日まで${isCur?'・今週':''}`;}
  else if(sc==='month'){big=d.getMonth()+1;small1=`${d.getFullYear()}年`;small2=`${isCur?'今月':'月'}`;}
  else if(sc==='year'){big=String(d.getFullYear()).slice(2);small1=`${d.getFullYear()}年`;small2=isCur?'今年':'';}
  else{big='∞';small1='いつか';small2='時期を決めていないこと';}
  const ph=sc==='someday'?'いつかやることを足す':`${{day:isCur?'今日':'この日',week:'この週',month:'この月',year:'この年'}[sc]}にやることを足す`;
  const ta=ui.tnewArea||'work';
  p.innerHTML=`<div class="tk-hero${sc==='someday'?' someday':''}">
    ${sc==='someday'?'':`<button type="button" class="tk-nav" data-tshift="-1" aria-label="前へ">‹</button>`}
    <div class="tk-date"><b>${big}</b><span><em>${small1}</em><em>${small2}</em></span></div>
    ${sc==='someday'?'':`<button type="button" class="tk-nav" data-tshift="1" aria-label="次へ">›</button>`}
    <div class="tk-prog">${tot?`<span class="tk-count">${done.length}<small>/${tot} 完了</small></span><span class="tk-bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="完了の割合"><i style="width:${pct}%"></i></span>`:'<span class="tk-count none">まだ何もありません</span>'}
    ${!isCur&&sc!=='someday'?'<button type="button" class="tk-back" data-tshift="0">今に戻る</button>':''}</div>
  </div>
  <div class="tk-scope" role="tablist" aria-label="期間">${['day','week','month','year','someday'].map(s=>`<button role="tab" data-tscope="${s}" aria-selected="${sc===s}">${SCOPE_LBL[s]}</button>`).join('')}</div>
  ${gsel?`<div class="tk-filter">★ ${esc(gsel.title)} のタスクだけ表示中<button type="button" data-tgoal="${gsel.id}">解除</button></div>`:''}
  <div class="tk-add"><input id="t-new" type="text" placeholder="${ph}" aria-label="タスクを足す" enterkeyhint="done">
    <button type="button" class="tk-area ${ta}" data-tnewarea aria-label="分野を切り替える">${ta==='life'?'プライベート':'仕事'}</button>
    <button type="button" class="tk-plus" id="t-add" aria-label="追加">＋</button></div>
  ${taskGroup('期限切れ・持ち越し',carry.sort(byDue),today,'late')}
  ${ui.tgoal?taskGroup('やること',open,today):taskGroup('仕事',work,today,'work')+taskGroup('プライベート',life,today,'life')}
  ${!tot&&!carry.length&&!week.length?`<p class="tk-empty">${sc==='someday'?'時期を決めていないことはありません。':'この期間にやることはまだありません。上の欄から足せます。'}</p>`:''}
  ${taskGroup('今週のうちに',week.filter(u=>!u.done).sort(byDue),today,'week')}
  ${done.length?`<details class="tk-done"><summary>終わったこと ${done.length}</summary><ul>${done.map(u=>taskRowHTML(u,today)).join('')}</ul></details>`:''}`;
  const inp=$('t-new');if(inp)inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();addTaskUI();}});
}
async function addTaskUI(){
  const v=$('t-new').value.trim();if(!v){setStatus('タスクの内容を入れてください。',true);return;}
  const sc=ui.tscope||'day';const d=ui.tdate||new Date();
  const body={content:v,area:ui.tnewArea||'work',goal_id:ui.tgoal||null};
  if(sc!=='someday'){body.scope=sc;body.period=periodKey(sc,d);}
  await api('/api/tasks',{method:'POST',body:JSON.stringify(body)});
  setStatus(ui.tgoal?'タスクを足して、目的につなぎました。':'タスクを足しました。');await load();
  const inp=$('t-new');if(inp)inp.focus();
}

function openAct(from){
  const v=$('actview');if(ui.actOpen){renderActView();return;}
  ui.actOpen=true;renderActView();
  const r=from&&from.getBoundingClientRect();const x=r?r.left+r.width/2:innerWidth/2,y=r?r.top+r.height/2:innerHeight/2;
  v.style.setProperty('--ox',x+'px');v.style.setProperty('--oy',y+'px');
  v.hidden=false;document.body.classList.add('lock');requestAnimationFrame(()=>v.classList.add('open'));v.scrollTop=0;
  try{history.pushState({act:1},'');}catch(_){}
}
function closeAct(fromPop){
  const v=$('actview');if(!ui.actOpen)return;ui.actOpen=false;v.classList.remove('open');document.body.classList.remove('lock');
  setTimeout(()=>{if(!ui.actOpen)v.hidden=true;},still.matches?0:320);
  if(!fromPop){try{if(history.state&&history.state.act)history.back();}catch(_){}}
  render();
}
window.addEventListener('popstate',()=>{if(ui.actOpen)closeAct(true);});

function spark(vals,col){
  const w=140,hgt=36,pts=vals.map((v,i)=>v==null?null:[i*(w/(vals.length-1)),v]);const nums=vals.filter(v=>v!=null);
  if(nums.length<1)return `<svg class="spark" viewBox="0 0 ${w} ${hgt}" aria-hidden="true"></svg>`;
  const mx=Math.max(...nums),mn=Math.min(0,...nums);const y=v=>hgt-4-((v-mn)/((mx-mn)||1))*(hgt-8);
  const d=pts.filter(Boolean).map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${y(p[1]).toFixed(1)}`).join(' ');
  const last=pts.filter(Boolean).pop();
  return `<svg class="spark" viewBox="0 0 ${w} ${hgt}" aria-hidden="true"><path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${y(last[1])}" r="3" fill="${col}"/></svg>`;
}

    if(t.dataset.gsave){const id=t.dataset.gsave;const g=goalsAll().find(x=>x.id===Number(id));
      await api('/api/goals/'+id,{method:'PATCH',body:JSON.stringify({title:$('ge-title').value,future:$('ge-future').value,criteria:$('ge-criteria').value,due:$('ge-due').value||null})});
      for(const el of document.querySelectorAll('[data-msedit]')){const m=g.milestones.find(x=>x.id===Number(el.dataset.msedit));if(m&&el.value.trim()&&el.value.trim()!==m.title)await api(`/api/goals/${id}/milestones/${m.id}`,{method:'PATCH',body:JSON.stringify({title:el.value})});}
      setStatus('目的を保存しました。');await load();return;}
    if(t.dataset.greqtasks){await api(`/api/goals/${t.dataset.greqtasks}/request-tasks`,{method:'POST'});setStatus('依頼しました。次の整理のときにClaudeがタスクを作ります。すぐ作るなら会話で「knowkinの目的からタスクを作って」と頼んでください。');await load();return;}
    if(t.dataset.gapprove){await api('/api/goals/'+t.dataset.gapprove,{method:'PATCH',body:JSON.stringify({status:'active'})});setStatus('目的にしました。ネットワークに星として現れます。');await load();return;}
    if(t.dataset.greject){const k='gr'+t.dataset.greject;if(ui.armed!==k){ui.armed=k;render();return;}ui.armed=null;await api('/api/goals/'+t.dataset.greject,{method:'PATCH',body:JSON.stringify({status:'dropped'})});setStatus('候補を見送りました。');await load();return;}
    if(t.dataset.gpin){const g=goalsAll().find(x=>x.id===Number(t.dataset.gpin));await api('/api/goals/'+g.id,{method:'PATCH',body:JSON.stringify({pinned:!g.pinned})});await load();return;}
    if(t.dataset.gstatus){const [id,st]=t.dataset.gstatus.split('|');await api('/api/goals/'+id,{method:'PATCH',body:JSON.stringify({status:st})});await load();return;}
    if(t.dataset.gdone){const k='gd'+t.dataset.gdone;if(ui.armed!==k){ui.armed=k;render();return;}ui.armed=null;await api('/api/goals/'+t.dataset.gdone,{method:'PATCH',body:JSON.stringify({status:'done'})});ui.view='goals';setStatus('おめでとうございます。目的を達成にしました。');await load();return;}
    if(t.dataset.gdrop){const k='gx'+t.dataset.gdrop;if(ui.armed!==k){ui.armed=k;render();return;}ui.armed=null;await api('/api/goals/'+t.dataset.gdrop,{method:'PATCH',body:JSON.stringify({status:'dropped'})});ui.view='goals';setStatus('目的を手放しました。');await load();return;}
    if(t.dataset.ms){const [gid,mid]=t.dataset.ms.split('|');await api(`/api/goals/${gid}/milestones/${mid}`,{method:'PATCH',body:JSON.stringify({done:t.checked})});await load();return;}
    if(t.dataset.msadd){const v=$('ms-new').value.trim();if(!v){setStatus('道のりの名前を入れてください。',true);return;}await api(`/api/goals/${t.dataset.msadd}/milestones`,{method:'POST',body:JSON.stringify({title:v})});await load();return;}
    if(t.dataset.node==='act'){openAct(t);return;}
    if(t.dataset.actclose!==undefined){closeAct();return;}
    if(t.dataset.acttab){const to=t.dataset.acttab;if(to!=='brain')ui.view=to;closeAct();if(to!=='brain')$('panel').scrollIntoView({block:'start'});return;}
    if(t.dataset.actgoals!==undefined){ui.view='goals';closeAct();$('panel').scrollIntoView({block:'start'});return;}
    if(t.dataset.actgoal){ui.view='goal';ui.goal=Number(t.dataset.actgoal);closeAct();$('panel').scrollIntoView({block:'start'});return;}
    if(t.dataset.tgoal){const id=Number(t.dataset.tgoal);ui.tgoal=ui.tgoal===id?null:id;render();return;}
    if(t.dataset.tscope){ui.tscope=t.dataset.tscope;ui.topen=null;render();return;}
    if(t.dataset.topen){const id=Number(t.dataset.topen);ui.topen=ui.topen===id?null:id;ui.armed=null;render();return;}
    if(t.dataset.tnewarea!==undefined){ui.tnewArea=(ui.tnewArea||'work')==='work'?'life':'work';t.textContent=ui.tnewArea==='life'?'プライベート':'仕事';t.className='tk-area '+ui.tnewArea;return;}
    if(t.dataset.tdone){const u=localUnit(t.dataset.tdone);const nd=!u.done;const row=t.closest('.tk-row');
      if(row&&nd&&!still.matches){row.classList.add('ticking');await new Promise(r=>setTimeout(r,420));}
      u.done=nd;render();await patch(u.id,{done:nd});setStatus(nd?'完了にしました。':'未完了に戻しました。');await load();return;}
    if(t.dataset.twhen){const [id,k]=t.dataset.twhen.split('|');const u=localUnit(id);const now=new Date();
      const body=k==='none'?{scope:''}:k==='tomorrow'?{scope:'day',period:periodKey('day',shiftDate('day',now,1))}:{scope:k==='today'?'day':k,period:periodKey(k==='today'?'day':k,now)};
      ui.topen=null;await patch(u.id,body);setStatus({today:'今日',tomorrow:'明日',week:'今週',month:'今月',none:'いつか'}[k]+'に移しました。');await load();return;}
    if(t.dataset.tarea){ui.tarea=t.dataset.tarea;render();return;}
    if(t.dataset.tshift!==undefined){const n=Number(t.dataset.tshift);ui.tdate=n===0?new Date():shiftDate(ui.tscope||'day',ui.tdate||new Date(),n);render();return;}
    if(t.id==='t-add'){addTaskUI();return;}
    if(t.dataset.area){const u=localUnit(t.dataset.area);const a=areaOf(u)==='life'?'work':'life';u.area=a;render();await patch(u.id,{area:a});return;}
    if(t.dataset.drawer!==undefined){ui.drawer=t.dataset.drawer||null;renderMemList();$('panel').scrollIntoView({behavior:'smooth',block:'start'});return;}
    if(t.dataset.view||t.dataset.node){
      if((recorder&&recorder.state==='recording')||live){setStatus('録音中です。止めてから切り替えてください。',true);return;}
      if(prog){setStatus('アップロードの処理中です。終わるまでこのままお待ちください。',true);return;}
      if(t.dataset.node){if(ui.layer!==t.dataset.node){ui.q='';ui.drawer=null;}ui.view='layer';ui.layer=t.dataset.node;}else ui.view=t.dataset.view;
      ui.armed=null;if(ui.view!=='rec')ui.result=null;if(ui.view==='growth')ui.growth=null;setStatus('');render();
      if(window.innerWidth<700)$('panel').scrollIntoView({behavior:'smooth',block:'start'});return;}
    if(t.id==='recbtn'){if(state.canSummarizeAudio||state.canTranscribe)toggleRecord();else toggleLive();return;}
    if(t.id==='vsave'){saveVoiceText();return;}
    if(t.id==='gsync'){t.disabled=true;setStatus('Gmail・Googleチャットを読み取っています…');const r=await api('/api/google/sync',{method:'POST'});ui.account=null;setStatus(r.error?r.error:`取り込みました（${r.result}）。整理はルーティンか「knowkinの未整理メモを整理して」で行われます。`,!!r.error);await load();return;}
    if(t.id==='gunlink'){if(ui.armed!=='gunlink'){ui.armed='gunlink';t.textContent='もう一度押すと解除します';t.classList.add('on');return;}
      ui.armed=null;await api('/api/google/disconnect',{method:'POST'});ui.account=null;setStatus('Googleとの連携を解除しました。');render();return;}
    if(t.dataset.catok){await api('/api/categories/'+t.dataset.catok,{method:'PATCH',body:JSON.stringify({reviewed:true})});await load();return;}
    if(t.dataset.catmerge){const into=$('merge-'+t.dataset.catmerge).value;await api(`/api/categories/${t.dataset.catmerge}/merge`,{method:'POST',body:JSON.stringify({into})});setStatus('既存の種類にまとめました。');await load();return;}
    if(t.id==='ppick'){$('pfile').click();return;}
    if(t.id==='psave'){sendPhoto();return;}
    if(t.id==='pick'){$('file').click();return;}
    if(t.dataset.p){const i=$('input');i.value+=(i.value&&!i.value.endsWith('\n')?'\n':'')+t.dataset.p;i.focus();return;}
    if(t.id==='save'){remember();return;}
    if(t.id==='grow'){t.disabled=true;setStatus('記憶を読み直して、核をまとめています…');try{await api('/api/core/grow',{method:'POST'});setStatus('核を育てました。');await load();}catch(err){setStatus(err.message,true);t.disabled=false;}return;}
    if(t.id==='copy'){const txt=await api('/api/handoff');const area=$('copyarea');
      area.innerHTML=`<textarea class="copybox" readonly aria-label="Claudeに渡す文章">${esc(txt)}</textarea><p class="status">コネクタ未登録のClaudeで使うときは、この文章を会話の最初に貼ってください。</p>`;
      area.querySelector('textarea').select();try{await navigator.clipboard.writeText(txt);area.querySelector('.status').textContent='コピーしました。';}catch(_){}return;}
    if(t.dataset.done){const u=localUnit(t.dataset.done);u.done=t.checked;render();await patch(u.id,{done:t.checked});await load();return;}
    if(t.dataset.ok){const u=localUnit(t.dataset.ok);u.reviewed=true;render();await patch(u.id,{reviewed:true});return;}
    if(t.dataset.del){if(ui.armed!==t.dataset.del){ui.armed=t.dataset.del;render();return;}
      const id=Number(t.dataset.del);state.units=state.units.filter(u=>u.id!==id);ui.armed=null;render();await api('/api/units/'+id,{method:'DELETE'});return;}
    if(t.id==='okall'){const ids=state.units.filter(u=>!u.reviewed).map(u=>u.id);state.units.forEach(u=>u.reviewed=true);render();for(const id of ids)await patch(id,{reviewed:true});return;}
    if(t.dataset.reclass){t.disabled=true;setStatus('分類しています…');const r=await api(`/api/memos/${t.dataset.reclass}/classify`,{method:'POST'});setStatus(`${r.added}件の記憶を残しました。`);await load();return;}
  }catch(err){if(err.message!=='unauthorized')setStatus('うまくいきませんでした：'+err.message,true);}
});
document.addEventListener('click',e=>{const a=e.target.closest('[data-askcopy]');if(a){try{navigator.clipboard.writeText(a.dataset.askcopy);}catch(_){}}});
document.addEventListener('change',async e=>{
  const s=e.target;
  if(s.dataset&&s.dataset.space){const name=s.dataset.space;const inc=s.checked;const sp=(ui.spaces||[]).find(x=>x.name===name);if(sp)sp.excluded=!inc;
    try{await api('/api/google/spaces',{method:'PATCH',body:JSON.stringify({name,excluded:!inc})});setStatus(inc?`「${sp?sp.title:name}」を取り込むようにしました。`:`「${sp?sp.title:name}」を取り込まないようにしました。まだ整理していない分も片づけました。`);}catch(err){setStatus(err.message,true);}return;}
  if(s.dataset&&s.dataset.move){const v=s.value;if(!v)return;const u=localUnit(s.dataset.move);
    const body=v==='none'?{scope:''}:{scope:v,period:periodKey(v,new Date())};
    try{await patch(u.id,body);setStatus(v==='none'?'「いつか」に移しました。':`${{day:'今日',week:'今週',month:'今月',year:'今年'}[v]}に移しました。`);await load();}catch(err){setStatus(err.message,true);}return;}
  if(!s.dataset||!s.dataset.retype)return;const u=localUnit(s.dataset.retype);u.type=s.value;render();
  try{await patch(u.id,{type:s.value});}catch(err){setStatus('種類の変更に失敗しました：'+err.message,true);}
});
['a-email','a-pass','a-name','a-code'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')submitAuth();}));
boot();
</script>
</body>
</html>
